# PostgreSQL settings for WAL archiving + point-in-time recovery (Part 2 · Stage 5).
# docker compose: passed as `command:` flags by deploy/backup/compose.backup.yml; a package install
# puts this file in conf.d. /wal-archive is a bind mount of SUTRA_WAL_ARCHIVE_DIR.
wal_level = replica
archive_mode = on
# copy to a temporary name, then rename: the shipper never sees a half-written segment
archive_command = 'test ! -f /wal-archive/%f && cp %p /wal-archive/%f.tmp && mv /wal-archive/%f.tmp /wal-archive/%f'
# a quiet server still closes (and ships) its open segment every 60 s → RPO ≈ 60 s + ship interval
archive_timeout = 60
max_wal_senders = 4
