# Fault-injection drill overlay (Part 2 S5-monitor, workflow "SutraERP Part 2 monitoring"):
#   docker compose -f compose.yaml -f compose.drill.yaml up -d --wait
# Adds a "staging host" PostgreSQL 18 (WAL archiving + pg_stat_statements), NATS JetStream with
# monitoring, Mailpit (SMTP stand-in for the college relay) and a webhook sink (chat / SMS /
# dead-man stand-in). The API runs on the runner host (metrics on :9464). Never used on a server.
services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: sutra
      POSTGRES_PASSWORD: sutra
      POSTGRES_DB: sutra
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - archive_mode=on
      - -c
      - archive_command=test ! -f /archive/%f && cp %p /archive/%f
      - -c
      - archive_timeout=60
    ports: ["127.0.0.1:5432:5432"]
    tmpfs: ["/archive:uid=999,gid=999"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sutra -d sutra"]
      interval: 3s
      retries: 40
  nats:
    image: nats:2.11-alpine
    command: ["-js", "-m", "8222"]
    ports: ["127.0.0.1:4222:4222"]
  mailpit:
    image: axllent/mailpit:v1.31
    ports: ["127.0.0.1:8025:8025"]
  alert-sink:
    image: python:3.13-alpine
    command: ["python3", "/sink/alert-sink.py"]
    volumes:
      - ./drill/alert-sink.py:/sink/alert-sink.py:ro
    tmpfs: ["/data"]
    ports: ["127.0.0.1:8000:8000"]
  postgres-exporter:
    depends_on:
      postgres: { condition: service_healthy }
  nats-exporter:
    depends_on: [nats]
