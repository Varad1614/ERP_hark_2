# promtool test rules sutra-onprem.rules.test.yaml (GENERATED by deploy/monitoring/gen.py)
rule_files:
- ../sutra-onprem.rules.yaml
evaluation_interval: 30s
tests:
- interval: 1m
  name: SutraApiDown fires
  input_series:
  - series: up{job="sutra-api",instance="api-0:9464"}
    values: '0x10'
  alert_rule_test:
  - eval_time: 5m
    alertname: SutraApiDown
    exp_alerts:
    - exp_labels:
        job: sutra-api
        instance: api-0:9464
        severity: critical
      exp_annotations:
        summary: SutraERP API is not being scraped (down or unreachable)
        description: 'Prometheus cannot scrape the API metrics listener for 2 minutes: the API process is down, restarting in a loop, or the metrics port is blocked.'
        runbook_url: https://github.com/Varad1614/ERP_hark_2/blob/erp_merge/sutraerp/docs/readiness/MONITORING_AND_SUPPORT.md#sutraapidown
- interval: 1m
  name: SutraApiDown stays quiet
  input_series:
  - series: up{job="sutra-api",instance="api-0:9464"}
    values: 1x10
  alert_rule_test:
  - eval_time: 5m
    alertname: SutraApiDown
    exp_alerts: []
- interval: 1m
  name: SutraApiSaturated fires
  input_series:
  - series: sutra_http_requests_in_flight{job="sutra-api",instance="api-0:9464"}
    values: 150x20
  alert_rule_test:
  - eval_time: 10m
    alertname: SutraApiSaturated
    exp_alerts:
    - exp_labels:
        severity: warning
      exp_annotations:
        summary: SutraERP API has more than 100 requests in flight
        description: 'More than 100 requests have been in flight for 5 minutes: the API or the database is not keeping up (check latency, the DB pool and host CPU).'
        runbook_url: https://github.com/Varad1614/ERP_hark_2/blob/erp_merge/sutraerp/docs/readiness/MONITORING_AND_SUPPORT.md#sutraapisaturated
- interval: 1m
  name: SutraApiSaturated stays quiet
  input_series:
  - series: sutra_http_requests_in_flight{job="sutra-api",instance="api-0:9464"}
    values: 5x20
  alert_rule_test:
  - eval_time: 10m
    alertname: SutraApiSaturated
    exp_alerts: []
- interval: 1m
  name: SutraApiRestarting fires
  input_series:
  - series: sutra_process_start_time_seconds{job="sutra-api",instance="api-0:9464"}
    values: 100 200 300 400 500 500 500 500
  alert_rule_test:
  - eval_time: 7m
    alertname: SutraApiRestarting
    exp_alerts:
    - exp_labels:
        instance: api-0:9464
        severity: warning
      exp_annotations:
        summary: SutraERP API restarted more than twice in 30 minutes
        description: The API process start time changed more than twice in 30 minutes (crash loop, OOM kill or failing health checks).
        runbook_url: https://github.com/Varad1614/ERP_hark_2/blob/erp_merge/sutraerp/docs/readiness/MONITORING_AND_SUPPORT.md#sutraapirestarting
- interval: 1m
  name: SutraApiRestarting stays quiet
  input_series:
  - series: sutra_process_start_time_seconds{job="sutra-api",instance="api-0:9464"}
    values: 100x10
  alert_rule_test:
  - eval_time: 7m
    alertname: SutraApiRestarting
    exp_alerts: []
- interval: 1m
  name: SutraPostgresDown fires
  input_series:
  - series: pg_up{job="postgres",instance="postgres-exporter:9187"}
    values: '0x10'
  alert_rule_test:
  - eval_time: 5m
    alertname: SutraPostgresDown
    exp_alerts:
    - exp_labels:
        job: postgres
        instance: postgres-exporter:9187
        severity: critical
      exp_annotations:
        summary: PostgreSQL is down
        description: postgres_exporter cannot connect to PostgreSQL for 1 minute. The API answers 503 on /health/ready and every write fails.
        runbook_url: https://github.com/Varad1614/ERP_hark_2/blob/erp_merge/sutraerp/docs/readiness/MONITORING_AND_SUPPORT.md#sutrapostgresdown
- interval: 1m
  name: SutraPostgresDown stays quiet
