- interval: 1m
  name: SutraBackupFailed fires
  input_series:
  - series: sutra_backup_last_run_success{job="node",instance="host:9100",kind="logical"}
    values: '0x10'
  alert_rule_test:
  - eval_time: 2m
    alertname: SutraBackupFailed
    exp_alerts:
    - exp_labels:
        job: node
        instance: host:9100
        kind: logical
        severity: critical
      exp_annotations:
        summary: The last SutraERP backup run failed
        description: The most recent backup run (sutra-backup-metrics.sh) exited non-zero. The previous good backup is still the restore point; RPO is at risk.
        runbook_url: https://github.com/Varad1614/ERP_hark_2/blob/erp_merge/sutraerp/docs/readiness/MONITORING_AND_SUPPORT.md#sutrabackupfailed
- interval: 1m
  name: SutraBackupFailed stays quiet
  input_series:
  - series: sutra_backup_last_run_success{job="node",instance="host:9100",kind="logical"}
    values: 1x10
  alert_rule_test:
  - eval_time: 2m
    alertname: SutraBackupFailed
    exp_alerts: []
- interval: 1h
  name: SutraBackupStale fires
  input_series:
  - series: sutra_backup_last_success_timestamp_seconds{job="node",instance="host:9100",kind="logical"}
    values: '0x30'
  alert_rule_test:
  - eval_time: 27h
    alertname: SutraBackupStale
    exp_alerts:
    - exp_labels:
        kind: logical
        severity: critical
      exp_annotations:
        summary: No successful SutraERP backup for more than 26 hours
        description: 'The newest successful backup is older than 26 hours (daily schedule + 2 h grace): the 24 h RPO is breached. The backup timer stopped or every run fails.'
        runbook_url: https://github.com/Varad1614/ERP_hark_2/blob/erp_merge/sutraerp/docs/readiness/MONITORING_AND_SUPPORT.md#sutrabackupstale
- interval: 1h
