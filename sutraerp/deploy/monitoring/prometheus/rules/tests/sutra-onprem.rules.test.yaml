  alert_rule_test:
  - eval_time: 5m
    alertname: SutraPostgresDown
    exp_alerts: []
- interval: 1m
  name: SutraPostgresExporterDown fires
  input_series:
  - series: up{job="postgres",instance="postgres-exporter:9187"}
    values: '0x10'
  alert_rule_test:
  - eval_time: 8m
    alertname: SutraPostgresExporterDown
    exp_alerts:
    - exp_labels:
        job: postgres
        instance: postgres-exporter:9187
        severity: warning
      exp_annotations:
        summary: postgres_exporter is not being scraped
        description: Prometheus cannot scrape postgres_exporter for 5 minutes; database alerts are blind.
        runbook_url: https://github.com/Varad1614/ERP_hark_2/blob/erp_merge/sutraerp/docs/readiness/MONITORING_AND_SUPPORT.md#sutrapostgresexporterdown
