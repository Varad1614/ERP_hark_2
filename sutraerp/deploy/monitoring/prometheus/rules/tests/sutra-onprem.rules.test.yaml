    alertname: SutraBackupStale
    exp_alerts: []
- interval: 1m
  name: SutraBackupMissing fires
  input_series:
  - series: up{job="node",instance="host:9100"}
    values: 1x200
  alert_rule_test:
  - eval_time: 3h
    alertname: SutraBackupMissing
    exp_alerts:
    - exp_labels:
        severity: warning
      exp_annotations:
        summary: No SutraERP backup has been recorded
        description: 'Prometheus has no backup metrics for 2 hours: the backup has never run with sutra-backup-metrics.sh, or node_exporter''s textfile directory is not mounted.'
        runbook_url: https://github.com/Varad1614/ERP_hark_2/blob/erp_merge/sutraerp/docs/readiness/MONITORING_AND_SUPPORT.md#sutrabackupmissing
