        datname: sutra
        schemaname: finance
        relname: payment
        severity: warning
      exp_annotations:
        summary: PostgreSQL table has more than 20 % dead rows
        description: 'A table has over 100,000 dead rows and more than 20 % of its rows are dead for an hour: autovacuum is not keeping up (long transactions, vacuum settings).'
        runbook_url: https://github.com/Varad1614/ERP_hark_2/blob/erp_merge/sutraerp/docs/readiness/MONITORING_AND_SUPPORT.md#sutrapostgrestablebloat
