    - exp_labels:
        instance: postgres-exporter:9187
        severity: warning
      exp_annotations:
        summary: PostgreSQL replica more than 5 minutes behind
        description: The standby replays WAL more than 5 minutes behind the primary; a failover now would lose recent writes.
        runbook_url: https://github.com/Varad1614/ERP_hark_2/blob/erp_merge/sutraerp/docs/readiness/MONITORING_AND_SUPPORT.md#sutrapostgresreplicationlag
