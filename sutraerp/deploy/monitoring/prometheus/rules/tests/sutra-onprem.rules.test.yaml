        description: A rule group fails to evaluate; some alerts cannot fire.
        runbook_url: https://github.com/Varad1614/ERP_hark_2/blob/erp_merge/sutraerp/docs/readiness/MONITORING_AND_SUPPORT.md#sutraruleevaluationfailures
- interval: 1m
