- interval: 1m
  name: SutraPostgresLongTransaction fires
  input_series:
  - series: pg_stat_activity_max_tx_duration{job="postgres",instance="postgres-exporter:9187",datname="sutra",state="active"}
    values: 900x20
  alert_rule_test:
  - eval_time: 10m
    alertname: SutraPostgresLongTransaction
    exp_alerts:
    - exp_labels:
        instance: postgres-exporter:9187
        datname: sutra
        severity: warning
      exp_annotations:
        summary: PostgreSQL transaction open for more than 10 minutes
        description: A transaction has been open for more than 10 minutes (slow query, stuck job or idle in transaction); it holds locks and blocks vacuum.
        runbook_url: https://github.com/Varad1614/ERP_hark_2/blob/erp_merge/sutraerp/docs/readiness/MONITORING_AND_SUPPORT.md#sutrapostgreslongtransaction
- interval: 1m
