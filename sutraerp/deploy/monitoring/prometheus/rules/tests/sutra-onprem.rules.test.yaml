      exp_annotations:
        summary: PostgreSQL statements averaging more than 1 s
        description: A statement averaged more than 1 second per call over 10 minutes (pg_stat_statements); see the PostgreSQL dashboard's slowest statements.
        runbook_url: https://github.com/Varad1614/ERP_hark_2/blob/erp_merge/sutraerp/docs/readiness/MONITORING_AND_SUPPORT.md#sutrapostgresslowqueries
