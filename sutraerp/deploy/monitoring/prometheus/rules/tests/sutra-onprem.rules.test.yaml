    alertname: SutraHostCpuHigh
    exp_alerts:
    - exp_labels:
        instance: host:9100
        severity: warning
      exp_annotations:
        summary: Host CPU above 90 %
        description: The host's CPUs have been more than 90 % busy for 15 minutes.
        runbook_url: https://github.com/Varad1614/ERP_hark_2/blob/erp_merge/sutraerp/docs/readiness/MONITORING_AND_SUPPORT.md#sutrahostcpuhigh
- interval: 1m
  name: SutraHostCpuHigh stays quiet
  input_series:
  - series: node_cpu_seconds_total{job="node",instance="host:9100",cpu="0",mode="idle"}
    values: 0+50x40
  alert_rule_test:
  - eval_time: 30m
    alertname: SutraHostCpuHigh
    exp_alerts: []
- interval: 1m
  name: SutraHostMemoryLow fires
  input_series:
  - series: node_memory_MemAvailable_bytes{job="node",instance="host:9100"}
    values: 5x20
  - series: node_memory_MemTotal_bytes{job="node",instance="host:9100"}
    values: 100x20
  alert_rule_test:
  - eval_time: 15m
    alertname: SutraHostMemoryLow
    exp_alerts:
    - exp_labels:
        job: node
        instance: host:9100
        severity: warning
      exp_annotations:
        summary: Less than 10 % memory available
        description: Available memory stayed below 10 % for 10 minutes; the kernel may OOM-kill PostgreSQL or the API.
        runbook_url: https://github.com/Varad1614/ERP_hark_2/blob/erp_merge/sutraerp/docs/readiness/MONITORING_AND_SUPPORT.md#sutrahostmemorylow
- interval: 1m
