    - exp_labels:
        instance: postgres-exporter:9187
        severity: warning
      exp_annotations:
        summary: PostgreSQL connections above 80 % of max_connections
        description: More than 80 % of max_connections are in use for 10 minutes; new connections will soon be refused.
        runbook_url: https://github.com/Varad1614/ERP_hark_2/blob/erp_merge/sutraerp/docs/readiness/MONITORING_AND_SUPPORT.md#sutrapostgresconnectionshigh
