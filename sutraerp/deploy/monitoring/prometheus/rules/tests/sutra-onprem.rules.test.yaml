  - series: node_memory_MemTotal_bytes{job="node",instance="host:9100"}
    values: 100x20
  alert_rule_test:
  - eval_time: 15m
    alertname: SutraHostMemoryLow
    exp_alerts: []
- interval: 1m
  name: SutraWatchdog fires
  input_series:
  - series: up{job="prometheus",instance="localhost:9090"}
    values: 1x5
  alert_rule_test:
  - eval_time: 2m
    alertname: SutraWatchdog
    exp_alerts:
    - exp_labels:
        severity: none
      exp_annotations:
        summary: Alerting pipeline heartbeat (always firing)
        description: 'Always firing. Route it to a dead-man''s switch: if it stops arriving, Prometheus or Alertmanager is down.'
        runbook_url: https://github.com/Varad1614/ERP_hark_2/blob/erp_merge/sutraerp/docs/readiness/MONITORING_AND_SUPPORT.md#sutrawatchdog
