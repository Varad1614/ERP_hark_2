    values: 500000x90
  - series: pg_stat_user_tables_n_live_tup{job="postgres",instance="postgres-exporter:9187",datname="sutra",schemaname="finance",relname="payment"}
    values: 1000000x90
  alert_rule_test:
  - eval_time: 80m
