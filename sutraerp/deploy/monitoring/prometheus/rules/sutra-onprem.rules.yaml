# SutraERP on-prem alert rules (Part 2 S5-monitor). GENERATED by deploy/monitoring/gen.py — edit
# there and run `python3 gen.py`. Loaded together with deploy/observability/alerts/sutra.rules.yaml.
# Runbooks: docs/readiness/MONITORING_AND_SUPPORT.md. promtool tests: rules/tests/.
groups:
- name: sutra-api
  interval: 30s
  rules:
  - alert: SutraApiDown
    expr: up{job="sutra-api"} == 0
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: SutraERP API is not being scraped (down or unreachable)
      description: 'Prometheus cannot scrape the API metrics listener for 2 minutes: the API process is down, restarting in a loop, or the metrics port is blocked.'
      runbook_url: https://github.com/Varad1614/ERP_hark_2/blob/erp_merge/sutraerp/docs/readiness/MONITORING_AND_SUPPORT.md#sutraapidown
  - alert: SutraApiSaturated
    expr: sum(sutra_http_requests_in_flight) > 100
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: SutraERP API has more than 100 requests in flight
      description: 'More than 100 requests have been in flight for 5 minutes: the API or the database is not keeping up (check latency, the DB pool and host CPU).'
      runbook_url: https://github.com/Varad1614/ERP_hark_2/blob/erp_merge/sutraerp/docs/readiness/MONITORING_AND_SUPPORT.md#sutraapisaturated
  - alert: SutraApiRestarting
    expr: sum by (instance) (changes(sutra_process_start_time_seconds[30m])) > 2
    labels:
      severity: warning
    annotations:
      summary: SutraERP API restarted more than twice in 30 minutes
      description: The API process start time changed more than twice in 30 minutes (crash loop, OOM kill or failing health checks).
      runbook_url: https://github.com/Varad1614/ERP_hark_2/blob/erp_merge/sutraerp/docs/readiness/MONITORING_AND_SUPPORT.md#sutraapirestarting
- name: sutra-postgres
  interval: 30s
  rules:
  - alert: SutraPostgresDown
    expr: pg_up == 0
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: PostgreSQL is down
      description: postgres_exporter cannot connect to PostgreSQL for 1 minute. The API answers 503 on /health/ready and every write fails.
      runbook_url: https://github.com/Varad1614/ERP_hark_2/blob/erp_merge/sutraerp/docs/readiness/MONITORING_AND_SUPPORT.md#sutrapostgresdown
  - alert: SutraPostgresExporterDown
    expr: up{job="postgres"} == 0
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: postgres_exporter is not being scraped
      description: Prometheus cannot scrape postgres_exporter for 5 minutes; database alerts are blind.
      runbook_url: https://github.com/Varad1614/ERP_hark_2/blob/erp_merge/sutraerp/docs/readiness/MONITORING_AND_SUPPORT.md#sutrapostgresexporterdown
  - alert: SutraPostgresConnectionsHigh
    expr: sum by (instance) (pg_stat_activity_count) / on (instance) max by (instance) (pg_settings_max_connections) > 0.8
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: PostgreSQL connections above 80 % of max_connections
      description: More than 80 % of max_connections are in use for 10 minutes; new connections will soon be refused.
      runbook_url: https://github.com/Varad1614/ERP_hark_2/blob/erp_merge/sutraerp/docs/readiness/MONITORING_AND_SUPPORT.md#sutrapostgresconnectionshigh
  - alert: SutraPostgresReplicationLag
    expr: max by (instance) (pg_replication_lag_seconds) > 300
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: PostgreSQL replica more than 5 minutes behind
      description: The standby replays WAL more than 5 minutes behind the primary; a failover now would lose recent writes.
      runbook_url: https://github.com/Varad1614/ERP_hark_2/blob/erp_merge/sutraerp/docs/readiness/MONITORING_AND_SUPPORT.md#sutrapostgresreplicationlag
  - alert: SutraPostgresLongTransaction
    expr: max by (instance, datname) (pg_stat_activity_max_tx_duration{datname!~"template.*|"}) > 600
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: PostgreSQL transaction open for more than 10 minutes
      description: A transaction has been open for more than 10 minutes (slow query, stuck job or idle in transaction); it holds locks and blocks vacuum.
      runbook_url: https://github.com/Varad1614/ERP_hark_2/blob/erp_merge/sutraerp/docs/readiness/MONITORING_AND_SUPPORT.md#sutrapostgreslongtransaction
  - alert: SutraPostgresSlowQueries
    expr: max by (instance, datname) (rate(pg_stat_statements_seconds_total[10m]) / clamp_min(rate(pg_stat_statements_calls_total[10m]), 1e-9)) > 1
    for: 15m
    labels:
      severity: warning
    annotations:
      summary: PostgreSQL statements averaging more than 1 s
      description: A statement averaged more than 1 second per call over 10 minutes (pg_stat_statements); see the PostgreSQL dashboard's slowest statements.
      runbook_url: https://github.com/Varad1614/ERP_hark_2/blob/erp_merge/sutraerp/docs/readiness/MONITORING_AND_SUPPORT.md#sutrapostgresslowqueries
  - alert: SutraPostgresTableBloat
    expr: (pg_stat_user_tables_n_dead_tup > 100000) and (pg_stat_user_tables_n_dead_tup / clamp_min(pg_stat_user_tables_n_live_tup + pg_stat_user_tables_n_dead_tup, 1) > 0.2)
    for: 1h
    labels:
      severity: warning
    annotations:
      summary: PostgreSQL table has more than 20 % dead rows
      description: 'A table has over 100,000 dead rows and more than 20 % of its rows are dead for an hour: autovacuum is not keeping up (long transactions, vacuum settings).'
      runbook_url: https://github.com/Varad1614/ERP_hark_2/blob/erp_merge/sutraerp/docs/readiness/MONITORING_AND_SUPPORT.md#sutrapostgrestablebloat
  - alert: SutraPostgresDeadlocks
    expr: sum by (instance) (increase(pg_stat_database_deadlocks[15m])) > 5
    labels:
      severity: warning
    annotations:
      summary: PostgreSQL deadlocks
      description: More than 5 deadlocks in 15 minutes; requests are being aborted and retried.
      runbook_url: https://github.com/Varad1614/ERP_hark_2/blob/erp_merge/sutraerp/docs/readiness/MONITORING_AND_SUPPORT.md#sutrapostgresdeadlocks
- name: sutra-backups
  interval: 30s
  rules:
  - alert: SutraBackupFailed
    expr: sutra_backup_last_run_success == 0
    labels:
      severity: critical
    annotations:
      summary: The last SutraERP backup run failed
      description: The most recent backup run (sutra-backup-metrics.sh) exited non-zero. The previous good backup is still the restore point; RPO is at risk.
      runbook_url: https://github.com/Varad1614/ERP_hark_2/blob/erp_merge/sutraerp/docs/readiness/MONITORING_AND_SUPPORT.md#sutrabackupfailed
  - alert: SutraBackupStale
    expr: time() - max by (kind) (sutra_backup_last_success_timestamp_seconds) > 26 * 3600
    labels:
      severity: critical
    annotations:
      summary: No successful SutraERP backup for more than 26 hours
      description: 'The newest successful backup is older than 26 hours (daily schedule + 2 h grace): the 24 h RPO is breached. The backup timer stopped or every run fails.'
      runbook_url: https://github.com/Varad1614/ERP_hark_2/blob/erp_merge/sutraerp/docs/readiness/MONITORING_AND_SUPPORT.md#sutrabackupstale
  - alert: SutraBackupMissing
    expr: absent(sutra_backup_last_success_timestamp_seconds)
    for: 2h
    labels:
      severity: warning
    annotations:
      summary: No SutraERP backup has been recorded
      description: 'Prometheus has no backup metrics for 2 hours: the backup has never run with sutra-backup-metrics.sh, or node_exporter''s textfile directory is not mounted.'
      runbook_url: https://github.com/Varad1614/ERP_hark_2/blob/erp_merge/sutraerp/docs/readiness/MONITORING_AND_SUPPORT.md#sutrabackupmissing
  - alert: SutraWalArchiveFailing
    expr: increase(pg_stat_archiver_failed_count[15m]) > 0
    labels:
      severity: critical
    annotations:
      summary: PostgreSQL WAL archiving is failing
      description: 'archive_command failed in the last 15 minutes: point-in-time recovery has a gap and pg_wal grows until the disk fills.'
      runbook_url: https://github.com/Varad1614/ERP_hark_2/blob/erp_merge/sutraerp/docs/readiness/MONITORING_AND_SUPPORT.md#sutrawalarchivefailing
  - alert: SutraWalArchiveStale
    expr: pg_stat_archiver_last_archive_age > 7200
    for: 15m
    labels:
      severity: warning
    annotations:
      summary: No WAL segment archived for 2 hours
      description: 'No WAL segment has been archived for 2 hours although archive_timeout forces one at least every 15 minutes: archiving is stuck.'
      runbook_url: https://github.com/Varad1614/ERP_hark_2/blob/erp_merge/sutraerp/docs/readiness/MONITORING_AND_SUPPORT.md#sutrawalarchivestale
- name: sutra-security
  interval: 30s
  rules:
  - alert: SutraLoginFailureSpike
    expr: sum(increase(sutra_security_events_total{event="login_failed"}[10m])) > 50
    labels:
      severity: warning
    annotations:
      summary: More than 50 failed sign-ins in 10 minutes
      description: Failed sign-ins spiked (password spraying, a broken integration, or many users locked out). Check the auth logs by login and source address.
      runbook_url: https://github.com/Varad1614/ERP_hark_2/blob/erp_merge/sutraerp/docs/readiness/MONITORING_AND_SUPPORT.md#sutraloginfailurespike
  - alert: SutraLoginThrottleSpike
    expr: sum(increase(sutra_security_events_total{event="login_throttled"}[10m])) > 10
    labels:
      severity: warning
    annotations:
      summary: More than 10 throttled sign-ins in 10 minutes
      description: 'Sign-ins are being refused by the lockout throttle: brute force against specific accounts.'
      runbook_url: https://github.com/Varad1614/ERP_hark_2/blob/erp_merge/sutraerp/docs/readiness/MONITORING_AND_SUPPORT.md#sutraloginthrottlespike
  - alert: SutraAccountLockouts
    expr: sum(increase(sutra_security_events_total{event="account_locked"}[15m])) > 5
    labels:
      severity: warning
    annotations:
      summary: More than 5 accounts locked in 15 minutes
      description: Several logins were locked after repeated failures in a short time.
      runbook_url: https://github.com/Varad1614/ERP_hark_2/blob/erp_merge/sutraerp/docs/readiness/MONITORING_AND_SUPPORT.md#sutraaccountlockouts
  - alert: SutraMfaFailureSpike
    expr: sum(increase(sutra_security_events_total{event="mfa_failed"}[10m])) > 20
    labels:
      severity: warning
    annotations:
      summary: More than 20 failed second-factor attempts in 10 minutes
      description: 'Second-factor codes / passkeys are being rejected in bulk: guessing against stolen passwords or a clock problem on the server (TOTP).'
      runbook_url: https://github.com/Varad1614/ERP_hark_2/blob/erp_merge/sutraerp/docs/readiness/MONITORING_AND_SUPPORT.md#sutramfafailurespike
  - alert: SutraPrivilegeChanges
    expr: sum(increase(sutra_security_events_total{event="privilege_changed"}[1h])) > 10
    labels:
      severity: warning
    annotations:
      summary: More than 10 privilege changes in an hour
      description: Roles were granted / revoked more than 10 times in an hour. Verify against approved requests in the audit trail (platform.identity.*).
      runbook_url: https://github.com/Varad1614/ERP_hark_2/blob/erp_merge/sutraerp/docs/readiness/MONITORING_AND_SUPPORT.md#sutraprivilegechanges
  - alert: SutraCrossTenantDenied
    expr: sum(increase(sutra_security_events_total{event="cross_tenant_denied"}[10m])) > 0
    labels:
      severity: warning
    annotations:
      summary: Requests tried to reach another tenant
      description: 'A request named a tenant or institution outside its session scope and was refused (403). Normal clients never do this: treat as probing until explained.'
      runbook_url: https://github.com/Varad1614/ERP_hark_2/blob/erp_merge/sutraerp/docs/readiness/MONITORING_AND_SUPPORT.md#sutracrosstenantdenied
  - alert: SutraWebhookSignatureFailures
    expr: sum(increase(sutra_security_events_total{event="webhook_signature_failed"}[10m])) > 2
    labels:
      severity: warning
    annotations:
      summary: Payment webhooks with invalid signatures
      description: 'At least 3 payment-gateway webhooks in 10 minutes had a missing or wrong signature: forged callbacks, or SUTRA_PAYMENT_WEBHOOK_SECRET differs from the gateway dashboard.'
      runbook_url: https://github.com/Varad1614/ERP_hark_2/blob/erp_merge/sutraerp/docs/readiness/MONITORING_AND_SUPPORT.md#sutrawebhooksignaturefailures
  - alert: SutraCheckoutSignatureFailures
    expr: sum(increase(sutra_security_events_total{event="checkout_signature_failed"}[30m])) > 4
    labels:
      severity: warning
    annotations:
      summary: Checkout callbacks with invalid signatures
      description: At least 5 checkout callbacks in 30 minutes failed signature verification (tampering or a wrong key secret).
      runbook_url: https://github.com/Varad1614/ERP_hark_2/blob/erp_merge/sutraerp/docs/readiness/MONITORING_AND_SUPPORT.md#sutracheckoutsignaturefailures
- name: sutra-queues
  interval: 30s
  rules:
  - alert: SutraOutboxPublishFailing
    expr: sum(increase(sutra_outbox_failed_total[15m])) > 10
    for: 15m
    labels:
      severity: warning
    annotations:
      summary: Outbox events keep failing to publish
      description: More than 10 outbox publish attempts failed in 15 minutes (NATS down or rejecting).
      runbook_url: https://github.com/Varad1614/ERP_hark_2/blob/erp_merge/sutraerp/docs/readiness/MONITORING_AND_SUPPORT.md#sutraoutboxpublishfailing
  - alert: SutraNatsDown
    expr: up{job="nats"} == 0
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: NATS (JetStream) is not being scraped
      description: 'The NATS exporter cannot be scraped or NATS is down for 2 minutes: events queue up in the outbox.'
      runbook_url: https://github.com/Varad1614/ERP_hark_2/blob/erp_merge/sutraerp/docs/readiness/MONITORING_AND_SUPPORT.md#sutranatsdown
  - alert: SutraJetStreamConsumerLag
    expr: max(jetstream_consumer_num_pending) > 1000
    for: 15m
    labels:
      severity: warning
    annotations:
      summary: A JetStream consumer is more than 1000 messages behind
      description: A JetStream consumer has more than 1000 pending messages for 15 minutes; a consumer is down or too slow.
      runbook_url: https://github.com/Varad1614/ERP_hark_2/blob/erp_merge/sutraerp/docs/readiness/MONITORING_AND_SUPPORT.md#sutrajetstreamconsumerlag
  - alert: SutraIdpSyncFailing
    expr: max(sutra_idp_sync_links{status="failed"}) > 0
    for: 30m
    labels:
      severity: warning
    annotations:
      summary: Identity provider sync keeps failing
      description: 'Identity links have stayed in sync_status=failed for 30 minutes: Keycloak is unreachable or refuses the admin client; the idp-sync job retries with back-off.'
      runbook_url: https://github.com/Varad1614/ERP_hark_2/blob/erp_merge/sutraerp/docs/readiness/MONITORING_AND_SUPPORT.md#sutraidpsyncfailing
  - alert: SutraIdpSyncConflict
    expr: max(sutra_idp_sync_links{status="conflict"}) > 0
    for: 1h
    labels:
      severity: warning
    annotations:
      summary: Identity links in conflict need an administrator
      description: 'An identity link is in sync_status=conflict (an IdP account owned elsewhere): it is not retried automatically.'
      runbook_url: https://github.com/Varad1614/ERP_hark_2/blob/erp_merge/sutraerp/docs/readiness/MONITORING_AND_SUPPORT.md#sutraidpsyncconflict
  - alert: SutraIdpSyncBacklog
    expr: max(sutra_idp_sync_links{status="pending"}) > 100
    for: 30m
    labels:
      severity: warning
    annotations:
      summary: More than 100 identity links waiting to sync
      description: The idp-sync job is not draining its queue (job disabled, slow IdP, or a bulk import).
      runbook_url: https://github.com/Varad1614/ERP_hark_2/blob/erp_merge/sutraerp/docs/readiness/MONITORING_AND_SUPPORT.md#sutraidpsyncbacklog
  - alert: SutraPaymentRecoveryStale
    expr: max(sutra_gateway_payments_open_stale) > 0
    for: 1h
    labels:
      severity: warning
    annotations:
      summary: Gateway payments still open after an hour
      description: Gateway payments stayed initiated / pending for over an hour and the recovery job has not resolved them (gateway API errors, or the job is off).
      runbook_url: https://github.com/Varad1614/ERP_hark_2/blob/erp_merge/sutraerp/docs/readiness/MONITORING_AND_SUPPORT.md#sutrapaymentrecoverystale
  - alert: SutraIdpSyncJobErrors
    expr: sum(increase(sutra_job_runs_total{job="idp-sync",outcome="error"}[30m])) >= 2
    labels:
      severity: warning
    annotations:
      summary: The idp-sync job run failed repeatedly
      description: The idp-sync scheduled job failed at least twice in 30 minutes (each run retries the backlog; persistent failure means its dependency is down).
      runbook_url: https://github.com/Varad1614/ERP_hark_2/blob/erp_merge/sutraerp/docs/readiness/MONITORING_AND_SUPPORT.md#sutraidpsyncjoberrors
  - alert: SutraPaymentRecoveryJobErrors
    expr: sum(increase(sutra_job_runs_total{job="payment_gateway_recovery",outcome="error"}[30m])) >= 2
    labels:
      severity: warning
    annotations:
      summary: The payment_gateway_recovery job run failed repeatedly
      description: The payment_gateway_recovery scheduled job failed at least twice in 30 minutes (each run retries the backlog; persistent failure means its dependency is down).
      runbook_url: https://github.com/Varad1614/ERP_hark_2/blob/erp_merge/sutraerp/docs/readiness/MONITORING_AND_SUPPORT.md#sutrapaymentrecoveryjoberrors
- name: sutra-integrations
  interval: 30s
  rules:
  - alert: SutraRazorpayErrors
    expr: sum(increase(sutra_integration_calls_total{integration="razorpay",outcome=~"error|timeout"}[10m])) >= 5 and sum(increase(sutra_integration_calls_total{integration="razorpay",outcome=~"error|timeout"}[10m]))
      / clamp_min(sum(increase(sutra_integration_calls_total{integration="razorpay"}[10m])), 1) > 0.25
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: Razorpay API calls failing
      description: More than 25 % of Razorpay API calls (at least 5) failed or timed out over 10 minutes.
      runbook_url: https://github.com/Varad1614/ERP_hark_2/blob/erp_merge/sutraerp/docs/readiness/MONITORING_AND_SUPPORT.md#sutrarazorpayerrors
  - alert: SutraS3Errors
    expr: sum(increase(sutra_integration_calls_total{integration="s3",outcome=~"error|timeout"}[10m])) >= 5 and sum(increase(sutra_integration_calls_total{integration="s3",outcome=~"error|timeout"}[10m]))
      / clamp_min(sum(increase(sutra_integration_calls_total{integration="s3"}[10m])), 1) > 0.25
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: Object storage (S3 / MinIO) calls failing
      description: More than 25 % of Object storage (S3 / MinIO) calls (at least 5) failed or timed out over 10 minutes.
      runbook_url: https://github.com/Varad1614/ERP_hark_2/blob/erp_merge/sutraerp/docs/readiness/MONITORING_AND_SUPPORT.md#sutras3errors
  - alert: SutraKeycloakAdminErrors
    expr: sum(increase(sutra_integration_calls_total{integration="keycloak_admin",outcome=~"error|timeout"}[10m])) >= 5 and sum(increase(sutra_integration_calls_total{integration="keycloak_admin",outcome=~"error|timeout"}[10m]))
      / clamp_min(sum(increase(sutra_integration_calls_total{integration="keycloak_admin"}[10m])), 1) > 0.25
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: Keycloak admin API calls failing
      description: More than 25 % of Keycloak admin API calls (at least 5) failed or timed out over 10 minutes.
      runbook_url: https://github.com/Varad1614/ERP_hark_2/blob/erp_merge/sutraerp/docs/readiness/MONITORING_AND_SUPPORT.md#sutrakeycloakadminerrors
  - alert: SutraSmtpErrors
    expr: sum(increase(sutra_integration_calls_total{integration="smtp",outcome=~"error|timeout"}[10m])) >= 5 and sum(increase(sutra_integration_calls_total{integration="smtp",outcome=~"error|timeout"}[10m]))
      / clamp_min(sum(increase(sutra_integration_calls_total{integration="smtp"}[10m])), 1) > 0.25
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: SMTP relay calls failing
      description: More than 25 % of SMTP relay calls (at least 5) failed or timed out over 10 minutes.
      runbook_url: https://github.com/Varad1614/ERP_hark_2/blob/erp_merge/sutraerp/docs/readiness/MONITORING_AND_SUPPORT.md#sutrasmtperrors
- name: sutra-host
  interval: 30s
  rules:
  - alert: SutraHostDown
    expr: up{job="node"} == 0
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: Host metrics unavailable (node_exporter down)
      description: 'node_exporter cannot be scraped for 2 minutes: the host is down or the exporter stopped.'
      runbook_url: https://github.com/Varad1614/ERP_hark_2/blob/erp_merge/sutraerp/docs/readiness/MONITORING_AND_SUPPORT.md#sutrahostdown
  - alert: SutraHostDiskSpaceLow
    expr: node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|nsfs|ramfs|devtmpfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|nsfs|ramfs|devtmpfs"} < 0.15
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: Less than 15 % disk space left
      description: A filesystem has less than 15 % free space (PostgreSQL data, WAL archive or backups).
      runbook_url: https://github.com/Varad1614/ERP_hark_2/blob/erp_merge/sutraerp/docs/readiness/MONITORING_AND_SUPPORT.md#sutrahostdiskspacelow
  - alert: SutraHostDiskSpaceCritical
    expr: node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|nsfs|ramfs|devtmpfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|nsfs|ramfs|devtmpfs"} < 0.05
    for: 5m
    labels:
      severity: critical
    annotations:
      summary: Less than 5 % disk space left
      description: A filesystem is almost full; PostgreSQL stops accepting writes when its disk is full.
      runbook_url: https://github.com/Varad1614/ERP_hark_2/blob/erp_merge/sutraerp/docs/readiness/MONITORING_AND_SUPPORT.md#sutrahostdiskspacecritical
  - alert: SutraHostDiskFillingUp
    expr: predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|nsfs|ramfs|devtmpfs"}[6h], 24 * 3600) < 0
    for: 1h
    labels:
      severity: warning
    annotations:
      summary: A filesystem will be full within 24 hours
      description: At the growth rate of the last 6 hours a filesystem runs out of space within a day.
      runbook_url: https://github.com/Varad1614/ERP_hark_2/blob/erp_merge/sutraerp/docs/readiness/MONITORING_AND_SUPPORT.md#sutrahostdiskfillingup
  - alert: SutraHostCpuHigh
    expr: 1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) > 0.9
    for: 15m
    labels:
      severity: warning
    annotations:
      summary: Host CPU above 90 %
      description: The host's CPUs have been more than 90 % busy for 15 minutes.
      runbook_url: https://github.com/Varad1614/ERP_hark_2/blob/erp_merge/sutraerp/docs/readiness/MONITORING_AND_SUPPORT.md#sutrahostcpuhigh
  - alert: SutraHostMemoryLow
    expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.1
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: Less than 10 % memory available
      description: Available memory stayed below 10 % for 10 minutes; the kernel may OOM-kill PostgreSQL or the API.
      runbook_url: https://github.com/Varad1614/ERP_hark_2/blob/erp_merge/sutraerp/docs/readiness/MONITORING_AND_SUPPORT.md#sutrahostmemorylow
- name: sutra-meta
  interval: 30s
  rules:
  - alert: SutraWatchdog
    expr: vector(1)
    labels:
      severity: none
    annotations:
      summary: Alerting pipeline heartbeat (always firing)
      description: 'Always firing. Route it to a dead-man''s switch: if it stops arriving, Prometheus or Alertmanager is down.'
      runbook_url: https://github.com/Varad1614/ERP_hark_2/blob/erp_merge/sutraerp/docs/readiness/MONITORING_AND_SUPPORT.md#sutrawatchdog
  - alert: SutraRuleEvaluationFailures
    expr: increase(prometheus_rule_evaluation_failures_total[10m]) > 0
    labels:
      severity: warning
    annotations:
      summary: Prometheus rule evaluations are failing
      description: A rule group fails to evaluate; some alerts cannot fire.
      runbook_url: https://github.com/Varad1614/ERP_hark_2/blob/erp_merge/sutraerp/docs/readiness/MONITORING_AND_SUPPORT.md#sutraruleevaluationfailures
  - alert: SutraAlertNotificationsFailing
    expr: sum by (integration) (increase(alertmanager_notifications_failed_total[15m])) > 0
    labels:
      severity: warning
    annotations:
      summary: Alertmanager cannot deliver notifications
      description: Alertmanager failed to deliver notifications (SMTP relay, chat or SMS webhook unreachable or refusing); alerts are not reaching people.
      runbook_url: https://github.com/Varad1614/ERP_hark_2/blob/erp_merge/sutraerp/docs/readiness/MONITORING_AND_SUPPORT.md#sutraalertnotificationsfailing
  - alert: SutraScrapeTargetDown
    expr: up{job=~"alertmanager|grafana"} == 0
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: A monitoring component is down
      description: Alertmanager or Grafana has not been scrapeable for 5 minutes.
      runbook_url: https://github.com/Varad1614/ERP_hark_2/blob/erp_merge/sutraerp/docs/readiness/MONITORING_AND_SUPPORT.md#sutrascrapetargetdown
