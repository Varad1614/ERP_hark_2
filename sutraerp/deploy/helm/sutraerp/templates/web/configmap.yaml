{{- /* 9B: nginx site config for the web image (same as deploy/docker/nginx.conf, upstream = the
release's API Service instead of the compose host `api`).
Part 1 · Stage 3 (S3-config, docs/security/config.md): the full security header set of the image
config (CSP with the build-time script hashes from /etc/nginx/sutra-csp.conf, no 'unsafe-inline'
script-src, frame-ancestors, Permissions-Policy, COOP/CORP), headers inherited by every location
(no per-location add_header, SEC-9D-009), HSTS when the ingress terminates TLS, body / timeout
limits and request rate zones. The ingress sends /api straight to the API Service, whose own
middleware sets the API headers. */ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sutraerp.componentName" (dict "root" . "component" "web") }}-nginx
  labels:
    {{- include "sutraerp.componentLabels" (dict "root" . "component" "web") | nindent 4 }}
data:
  default.conf: |
    map $uri $sutra_cache_control {
      ~^/api/     "";
      ~^/assets/  "public, max-age=31536000, immutable";
      default     "no-cache";
    }
    limit_req_zone $binary_remote_addr zone=sutra_credentials:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=sutra_api:20m rate=100r/s;
    limit_req_status 429;

    server {
      listen {{ .Values.web.port }};
      server_name _;
      root /usr/share/nginx/html;
      server_tokens off;

      client_max_body_size 2m;
      client_body_timeout 30s;
      client_header_timeout 15s;
      send_timeout 30s;
      keepalive_timeout 30s;

      include /etc/nginx/sutra-csp.conf;

      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy strict-origin-when-cross-origin always;
      add_header X-Frame-Options DENY always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self' $sutra_csp_script_hashes; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
      add_header Cross-Origin-Opener-Policy same-origin always;
      add_header Cross-Origin-Resource-Policy same-origin always;
      add_header Cache-Control $sutra_cache_control always;
      {{- if and .Values.ingress.enabled .Values.ingress.tls.enabled }}
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
      {{- end }}

      proxy_hide_header X-Content-Type-Options;
      proxy_hide_header Referrer-Policy;
      proxy_hide_header X-Frame-Options;
      proxy_hide_header Content-Security-Policy;
      proxy_hide_header Permissions-Policy;
      proxy_hide_header Cross-Origin-Resource-Policy;
      proxy_hide_header Strict-Transport-Security;
      proxy_connect_timeout 5s;
      proxy_send_timeout 35s;
      proxy_read_timeout 35s;

      location ~ ^/api/v1/auth/(login|mfa) {
        limit_req zone=sutra_credentials burst=50 nodelay;
        proxy_pass http://{{ include "sutraerp.componentName" (dict "root" . "component" "api") }}:{{ .Values.api.port }};
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }

      location /api/ {
        limit_req zone=sutra_api burst=400 nodelay;
        proxy_pass http://{{ include "sutraerp.componentName" (dict "root" . "component" "api") }}:{{ .Values.api.port }};
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }

      location /assets/ {
        try_files $uri =404;
      }

      location = /healthz {
        access_log off;
        return 200 "ok\n";
      }

      location / {
        try_files $uri $uri/ /index.html;
      }
    }
