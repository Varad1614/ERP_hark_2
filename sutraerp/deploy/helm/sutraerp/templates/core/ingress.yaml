{{- /* 9B: Ingress: /api → api, everything else → web (SPA). */ -}}
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "sutraerp.fullname" . }}
  labels:
    {{- include "sutraerp.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "sutraerp.componentName" (dict "root" . "component" "api") }}
                port: { name: http }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "sutraerp.componentName" (dict "root" . "component" "web") }}
                port: { name: http }
{{- end }}
