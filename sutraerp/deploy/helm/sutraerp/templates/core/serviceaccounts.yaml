{{- /* 9B: one ServiceAccount per workload; bound to the OpenBao kubernetes-auth role `sutraerp`
(docs/batch9-contracts.md §5). The token is mounted only when the OpenBao agent needs it. The
migrate account is a hook resource when the migrate Job is a hook (it must exist first). */ -}}
{{- $automount := ternary true false (eq .Values.secrets.mode "openbao") }}
{{- $accounts := list "api" "backup" }}
{{- if eq .Values.postgres.mode "bundled" }}{{ $accounts = append $accounts "postgres" }}{{ end }}
{{- range $c := $accounts }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sutraerp.componentName" (dict "root" $ "component" $c) }}
  labels:
    {{- include "sutraerp.componentLabels" (dict "root" $ "component" $c) | nindent 4 }}
automountServiceAccountToken: {{ $automount }}
{{- end }}
{{- if .Values.migrations.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sutraerp.componentName" (dict "root" . "component" "migrate") }}
  labels:
    {{- include "sutraerp.componentLabels" (dict "root" . "component" "migrate") | nindent 4 }}
  {{- if include "sutraerp.migrateHook" . }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation
  {{- end }}
automountServiceAccountToken: {{ $automount }}
{{- end }}
