{{- /* 9B: public API Service (web / ingress). The separate metrics Service `sutraerp-api-metrics`
(:9464, Prometheus only) is rendered by 9A in templates/observability/api-metrics.yaml, so the
chart has exactly one after the merge (docs/batch9-contracts.md §3.1). */ -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sutraerp.componentName" (dict "root" . "component" "api") }}
  labels:
    {{- include "sutraerp.componentLabels" (dict "root" . "component" "api") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "sutraerp.selectorLabels" (dict "root" . "component" "api") | nindent 4 }}
  ports:
    - { name: http, port: {{ .Values.api.port }}, targetPort: http, protocol: TCP }
