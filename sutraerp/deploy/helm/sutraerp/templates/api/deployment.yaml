{{- /* 9B: API Deployment (docs/batch9-contracts.md §5, §10). */ -}}
{{- $name := include "sutraerp.componentName" (dict "root" . "component" "api") -}}
{{- $openbao := include "sutraerp.openbaoEnabled" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "sutraerp.componentLabels" (dict "root" . "component" "api") | nindent 4 }}
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "sutraerp.selectorLabels" (dict "root" . "component" "api") | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels:
        {{- include "sutraerp.componentLabels" (dict "root" . "component" "api") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/core/configmap.yaml") . | sha256sum }}
        {{- if $openbao }}
        {{- include "sutraerp.openbaoAnnotations" (dict "root" . "file" "sutra.env" "template" (include "sutraerp.openbaoDotenv" (dict "root" . "exclude" (list "POSTGRES_PASSWORD")))) | nindent 8 }}
        {{- end }}
        {{- with .Values.api.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: {{ ternary true false (eq .Values.secrets.mode "openbao") }}
      {{- include "sutraerp.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- toYaml .Values.api.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.api.terminationGracePeriodSeconds }}
      containers:
        - name: api
          image: {{ include "sutraerp.image" (dict "root" . "img" .Values.image.api) | quote }}
          imagePullPolicy: {{ .Values.image.api.pullPolicy }}
          args: ["serve"]
          ports:
            - { name: http, containerPort: {{ .Values.api.port }}, protocol: TCP }
            - { name: metrics, containerPort: {{ .Values.api.metricsPort }}, protocol: TCP }
          envFrom:
            - configMapRef:
                name: {{ include "sutraerp.fullname" . }}-env
            {{- if eq .Values.secrets.mode "kubernetes" }}
            - secretRef:
                name: {{ required "secrets.existingSecret is required when secrets.mode=kubernetes" .Values.secrets.existingSecret }}
            {{- end }}
          {{- if $openbao }}
          env:
            - name: SUTRA_ENV_FILE
              value: /vault/secrets/sutra.env
          {{- end }}
          startupProbe:
            httpGet: { path: {{ .Values.api.probes.liveness }}, port: http }
            failureThreshold: {{ .Values.api.startupProbe.failureThreshold }}
            periodSeconds: {{ .Values.api.startupProbe.periodSeconds }}
          livenessProbe:
            httpGet: { path: {{ .Values.api.probes.liveness }}, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: {{ .Values.api.probes.readiness }}, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.api.securityContext | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
