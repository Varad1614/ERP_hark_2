{{- /* 9C: GENERATED by deploy/backup/gen-chart.py from deploy/backup/* and
deploy/flowable/init-db.sh. Do not edit; re-run the generator. */ -}}
{{- if or .Values.backup.enabled (and .Values.flowable.enabled .Values.flowable.bundled .Values.flowable.initDb.enabled) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sutraerp.data.name" (dict "root" . "component" "backup-scripts") }}
  labels:
    {{- include "sutraerp.data.labels" (dict "root" . "component" "backup") | nindent 4 }}
data:
  lib.sh: |
    #!/usr/bin/env bash
    # Shared helpers for sutra-backup.sh / sutra-restore.sh (slice 9C, docs/batch9-contracts.md §11).
    # Needs only bash, coreutils (sha256sum, stat) and the PostgreSQL 18 client tools (psql, pg_dump,
    # pg_restore), so the stock `postgres:18` image is a valid backup image (no jq / python): JSON is
    # built and compared inside PostgreSQL.
    #
    # Connection: SUTRA_BACKUP_DATABASE_URL (the `sutra` database, as the schema owner / a superuser),
    # else SUTRA_MIGRATION_DATABASE_URL (owner), else DATABASE_URL. Flowable: SUTRA_BACKUP_FLOWABLE_DATABASE_URL (optional; empty = no Flowable dump).
    # Tool overrides: PSQL / PG_DUMP / PG_RESTORE (default: from PATH; PG_BIN=/usr/lib/postgresql/18/bin
    # prepends that directory).

    set -euo pipefail

    if [[ -n "${PG_BIN:-}" ]]; then
      PATH="$PG_BIN:$PATH"
    fi
    PSQL=${PSQL:-psql}
    PG_DUMP=${PG_DUMP:-pg_dump}
    PG_RESTORE=${PG_RESTORE:-pg_restore}

    # The application schemas (the same list as migrations/20261014000003_runtime_db_roles.sql).
    SUTRA_SCHEMAS="platform institution student academic people finance campus services exams resources"

    log() { printf '%s %s\n' "$(date -u +%H:%M:%SZ)" "$*" >&2; }
    die() { log "ERROR: $*"; exit 1; }
    ok() { printf 'ok %s\n' "$*"; }

    need() {
      local t
      for t in "$@"; do command -v "$t" >/dev/null 2>&1 || die "missing tool: $t"; done
    }

    sutra_url() {
      local u=${SUTRA_BACKUP_DATABASE_URL:-}
      [[ -n "$u" ]] || u=${SUTRA_MIGRATION_DATABASE_URL:-}
      [[ -n "$u" ]] || u=${DATABASE_URL:-}
      [[ -n "$u" ]] || die "set SUTRA_BACKUP_DATABASE_URL (or SUTRA_MIGRATION_DATABASE_URL / DATABASE_URL)"
      printf '%s' "$u"
    }

    flowable_url() { printf '%s' "${SUTRA_BACKUP_FLOWABLE_DATABASE_URL:-}"; }

    # Same server, another database: replaces the path of a postgres:// URL (keeps the query string).
    url_with_db() {
      local url=$1 db=$2 base query=""
      if [[ "$url" == *\?* ]]; then query="?${url#*\?}"; url=${url%%\?*}; fi
      base=${url%/*}
      printf '%s/%s%s' "$base" "$db" "$query"
    }

    db_name_of() {
      local url=${1%%\?*}
      printf '%s' "${url##*/}"
    }

    # psql -qAtX with ON_ERROR_STOP; extra args are passed through.
    q() {
      local url=$1; shift
      "$PSQL" "$url" -qAtX -v ON_ERROR_STOP=1 "$@"
    }

    # SQL (one row, one column): JSON object {"<schema>.<table>": <exact count>} of every base table in
    # the application schemas + public._sqlx_migrations. query_to_xml keeps it read-only and inside the
    # caller's snapshot (no functions are created).
    row_counts_sql() {
      local list="" s
      for s in $SUTRA_SCHEMAS; do list+="'$s',"; done
      list=${list%,}
      cat <<SQL
    SELECT coalesce(jsonb_object_agg(t.k, t.n), '{}'::jsonb)::text FROM (
      SELECT c.table_schema || '.' || c.table_name AS k,
             (xpath('/row/n/text()', query_to_xml(
                format('SELECT count(*) AS n FROM %I.%I', c.table_schema, c.table_name),
                false, true, '')))[1]::text::bigint AS n
        FROM information_schema.tables c
       WHERE c.table_type = 'BASE TABLE'
         AND (c.table_schema IN ($list)
              OR (c.table_schema = 'public' AND c.table_name = '_sqlx_migrations'))
    ) t;
    SQL
    }

    # SQL: JSON array of the audit chain heads [{tenantId, seq, headHash}] (call only when
    # platform.audit_chain_head exists: `SELECT to_regclass('platform.audit_chain_head') IS NOT NULL`).
    audit_heads_sql() {
      cat <<'SQL'
    SELECT coalesce(jsonb_agg(jsonb_build_object('tenantId', tenant_id, 'seq', seq,
             'headHash', encode(head_hash, 'hex')) ORDER BY tenant_id), '[]'::jsonb)::text
      FROM platform.audit_chain_head;
    SQL
    }

    # SQL: latest applied migration version (call only when public._sqlx_migrations exists).
    migration_version_sql() {
      echo "SELECT coalesce(max(version), 0) FROM public._sqlx_migrations WHERE success;"
    }

    # SQL: the append-only privilege facts of the audit tables, one line each "<role> <table> <priv> <t|f>".
    # Expected: INSERT/SELECT t, UPDATE/DELETE/TRUNCATE f for every runtime role (UPDATE t on the head).
    audit_grants_sql() {
      cat <<'SQL'
    SELECT r.role || ' ' || t.tbl || ' ' || p.priv || ' ' ||
           CASE WHEN has_table_privilege(r.role, t.tbl, p.priv) THEN 't' ELSE 'f' END
      FROM (VALUES ('sutra_platform'), ('sutra_app')) r(role)
      CROSS JOIN (VALUES ('platform.audit_log'), ('platform.audit_chain_entry'),
                         ('platform.audit_anchor'), ('platform.audit_chain_head')) t(tbl)
      CROSS JOIN (VALUES ('INSERT'), ('UPDATE'), ('DELETE'), ('TRUNCATE')) p(priv)
     WHERE EXISTS (SELECT 1 FROM pg_roles WHERE rolname = r.role)
       AND to_regclass(t.tbl) IS NOT NULL
     ORDER BY 1;
    SQL
    }

    # Checks the audit-table grants survived (append-only); prints "ok audit grants" or dies.
    check_audit_grants() {
      local url=$1 line role tbl priv has bad=0 n=0
      while read -r role tbl priv has; do
        [[ -n "$role" ]] || continue
        n=$((n + 1))
        case "$priv" in
          INSERT) [[ "$has" == t ]] || { log "missing INSERT for $role on $tbl"; bad=1; } ;;
          UPDATE) if [[ "$tbl" == platform.audit_chain_head ]]; then
                    [[ "$has" == t ]] || { log "missing UPDATE for $role on $tbl"; bad=1; }
                  else
                    [[ "$has" == f ]] || { log "$role may UPDATE append-only $tbl"; bad=1; }
                  fi ;;
          DELETE|TRUNCATE) [[ "$has" == f ]] || { log "$role may $priv append-only $tbl"; bad=1; } ;;
        esac
      done < <(q "$url" -c "$(audit_grants_sql)")
      [[ $n -gt 0 ]] || die "audit grants: no runtime roles / audit tables found"
      [[ $bad -eq 0 ]] || die "audit grants changed (append-only privileges lost)"
      line="audit grants (append-only, $n privilege checks)"
      ok "$line"
    }

    file_bytes() { stat -c %s "$1"; }
    file_sha256() { sha256sum "$1" | cut -d' ' -f1; }
  sutra-backup.sh: |
    #!/usr/bin/env bash
    # SutraERP backup (slice 9C) — format `sutra-backup/v1` (docs/batch9-contracts.md §11).
    #
    #   sutra-backup.sh [--out-dir DIR] [--tar] [--retention-days N]
    #
    # Writes DIR/sutra-backup-<env>-<UTC YYYYMMDDTHHMMSSZ>/ (or .tar with --tar):
    #   sutra.dump      pg_dump -Fc --no-owner of the `sutra` database (ACLs KEPT: the append-only
    #                   grants on platform.audit_log / audit_chain_* must survive a restore)
    #   flowable.dump   same for the `flowable` database when SUTRA_BACKUP_FLOWABLE_DATABASE_URL is set
    #   manifest.json   format, createdAt, environment, gitSha, migrationVersion, databases[{name, file,
    #                   bytes, sha256}], auditHeads[], rowCounts{} — counts and heads are read inside
    #                   the SAME snapshot pg_dump uses (pg_export_snapshot), so they match the dump even
    #                   while the API keeps writing.
    # Prints the backup path on the last stdout line.
    #
    # Env: SUTRA_BACKUP_DATABASE_URL (else DATABASE_URL), SUTRA_BACKUP_FLOWABLE_DATABASE_URL,
    #      SUTRA_BACKUP_DIR (default ./backups), SUTRA_ENV (default development), SUTRA_GIT_SHA,
    #      SUTRA_BACKUP_RETENTION_DAYS (delete older backups in the out dir; default 0 = keep all),
    #      SUTRA_BACKUP_AGE_RECIPIENT (optional: encrypt the tarball with `age`, implies --tar).
    set -euo pipefail
    here=$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)
    # shellcheck source=lib.sh
    . "$here/lib.sh"

    out_dir=${SUTRA_BACKUP_DIR:-./backups}
    tar_it=false
    retention=${SUTRA_BACKUP_RETENTION_DAYS:-0}
    while [[ $# -gt 0 ]]; do
      case "$1" in
        --out-dir) out_dir=$2; shift 2 ;;
        --tar) tar_it=true; shift ;;
        --retention-days) retention=$2; shift 2 ;;
        -h|--help) sed -n '2,20p' "$0"; exit 0 ;;
        *) die "unknown argument: $1" ;;
      esac
    done
    [[ -n "${SUTRA_BACKUP_AGE_RECIPIENT:-}" ]] && tar_it=true

    need "$PSQL" "$PG_DUMP" sha256sum stat
    url=$(sutra_url)
    furl=$(flowable_url)
    env_name=${SUTRA_ENV:-development}
    stamp=$(date -u +%Y%m%dT%H%M%SZ)
    name="sutra-backup-${env_name}-${stamp}"
    mkdir -p "$out_dir"
    dir="$out_dir/$name"
    mkdir "$dir"
    trap 'rc=$?; if [[ $rc -ne 0 ]]; then rm -rf "$dir"; fi' EXIT

    # --- one REPEATABLE READ snapshot: counts + heads + version, then pg_dump --snapshot ----------
    coproc PSQLCO { "$PSQL" "$url" -qAtX -v ON_ERROR_STOP=1 2>&1; }
    co_in=${PSQLCO[1]}
    co_out=${PSQLCO[0]}
    ans=""
    ask() { # one SQL statement → its single output line in $ans (no subshell: coproc fds stay usable)
      printf '%s\n' "$1" >&"$co_in"
      IFS= read -r -t 900 ans <&"$co_out" || die "psql ended while running: ${1:0:60}…"
    }
    ask "BEGIN ISOLATION LEVEL REPEATABLE READ, READ ONLY; SELECT pg_export_snapshot();"
    snapshot=$ans
    [[ "$snapshot" =~ ^[0-9A-Fa-f-]+$ ]] || die "could not export a snapshot: $snapshot"
    ask "$(row_counts_sql | tr '\n' ' ')"
    row_counts=$ans
    [[ "$row_counts" == \{* ]] || die "row counts: $row_counts"
    ask "SELECT to_regclass('platform.audit_chain_head') IS NOT NULL;"
    if [[ "$ans" == t ]]; then
      ask "$(audit_heads_sql | tr '\n' ' ')"
      audit_heads=$ans
    else
      audit_heads='[]'
    fi
    [[ "$audit_heads" == \[* ]] || die "audit heads: $audit_heads"
    ask "SELECT to_regclass('public._sqlx_migrations') IS NOT NULL;"
    if [[ "$ans" == t ]]; then
      ask "$(migration_version_sql)"
      mig_version=$ans
    else
      mig_version=0
    fi
    [[ "$mig_version" =~ ^[0-9]+$ ]] || die "migration version: $mig_version"
    log "snapshot $snapshot: migration $mig_version"

    "$PG_DUMP" "$url" -Fc --no-owner --snapshot="$snapshot" -f "$dir/sutra.dump" \
      || die "pg_dump sutra failed"
    printf 'COMMIT;\n\\q\n' >&"$co_in"
    wait "$PSQLCO_PID" 2>/dev/null || true
    ok "dump sutra ($(file_bytes "$dir/sutra.dump") bytes)"

    dbs_json="[{\"name\": \"$(db_name_of "$url")\", \"file\": \"sutra.dump\", \"bytes\": $(file_bytes "$dir/sutra.dump"), \"sha256\": \"$(file_sha256 "$dir/sutra.dump")\"}"
    if [[ -n "$furl" ]]; then
      "$PG_DUMP" "$furl" -Fc --no-owner -f "$dir/flowable.dump" || die "pg_dump flowable failed"
      dbs_json+=", {\"name\": \"$(db_name_of "$furl")\", \"file\": \"flowable.dump\", \"bytes\": $(file_bytes "$dir/flowable.dump"), \"sha256\": \"$(file_sha256 "$dir/flowable.dump")\"}"
      ok "dump flowable ($(file_bytes "$dir/flowable.dump") bytes)"
    fi
    dbs_json+="]"

    # --- manifest (pretty JSON rendered by PostgreSQL; no jq needed) -------------------------------
    q "$url" \
      -v env_name="$env_name" -v sha="${SUTRA_GIT_SHA:-unknown}" \
      -v mig="$mig_version" -v dbs="$dbs_json" -v heads="$audit_heads" -v counts="$row_counts" \
      >"$dir/manifest.json" <<'SQL'
    SELECT jsonb_pretty(jsonb_build_object(
      'format', 'sutra-backup/v1',
      'createdAt', to_char(now() AT TIME ZONE 'UTC', 'YYYY-MM-DD"T"HH24:MI:SS"Z"'), 'environment', :'env_name',
      'gitSha', :'sha', 'migrationVersion', (:'mig')::bigint, 'databases', (:'dbs')::jsonb,
      'auditHeads', (:'heads')::jsonb, 'rowCounts', (:'counts')::jsonb));
    SQL
    tables=$(q "$url" -v counts="$row_counts" <<'SQL'
    SELECT count(*) FROM jsonb_object_keys((:'counts')::jsonb);
    SQL
    )
    ok "manifest ($tables tables, $(q "$url" -v heads="$audit_heads" <<'SQL'
    SELECT jsonb_array_length((:'heads')::jsonb);
    SQL
    ) audit heads, migration $mig_version)"

    result=$dir
    if $tar_it; then
      tar -C "$out_dir" -cf "$out_dir/$name.tar" "$name"
      rm -rf "$dir"
      result="$out_dir/$name.tar"
      if [[ -n "${SUTRA_BACKUP_AGE_RECIPIENT:-}" ]]; then
        need age
        age -r "$SUTRA_BACKUP_AGE_RECIPIENT" -o "$result.age" "$result"
        rm -f "$result"
        result="$result.age"
      fi
      ok "archive $(basename "$result")"
    fi
    trap - EXIT

    if [[ "$retention" =~ ^[0-9]+$ && "$retention" -gt 0 ]]; then
      find "$out_dir" -maxdepth 1 -name 'sutra-backup-*' -mtime "+$retention" -print -exec rm -rf {} + >&2 || true
    fi
    echo "$result"
  sutra-restore.sh: |
    #!/usr/bin/env bash
    # SutraERP restore (slice 9C) — format `sutra-backup/v1` (docs/batch9-contracts.md §11,
    # docs/runbooks/backup-dr.md).
    #
    #   sutra-restore.sh <backup dir | .tar | .tar.age> [--skip-migrate] [--no-rebuild]
    #
    # 1. verify format + sha256 / size of every dump against manifest.json
    # 2. re-create the cluster roles (roles.sql) so the dumps' ACLs (append-only audit grants) apply
    # 3. create the target databases when missing, `pg_restore --clean --if-exists --no-owner`
    #    (ACLs restored; the flowable dump is restored as role `flowable`)
    # 4. `sutra-api migrate` (idempotent; provisions SUTRA_DB_RUNTIME_USER when set)
    # 5. compare rowCounts + auditHeads with the manifest, check the audit-table grants
    # 6. request an OpenSearch rebuild (platform.search_checkpoint.rebuild_requested_at = now())
    # One "ok <check>" line per step; exits non-zero on the first failure.
    #
    # Env: SUTRA_BACKUP_DATABASE_URL (else DATABASE_URL) = the target `sutra` database URL (superuser /
    #      CREATEROLE + CREATEDB); SUTRA_BACKUP_FLOWABLE_DATABASE_URL = target flowable database (default:
    #      same server, database named as in the manifest); SUTRA_API_BIN (default `sutra-api`);
    #      SUTRA_BACKUP_AGE_IDENTITY (age identity file for .age archives).
    set -euo pipefail
    here=$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)
    # shellcheck source=lib.sh
    . "$here/lib.sh"

    src=""
    migrate=true
    rebuild=true
    while [[ $# -gt 0 ]]; do
      case "$1" in
        --skip-migrate) migrate=false; shift ;;
        --no-rebuild) rebuild=false; shift ;;
        -h|--help) sed -n '2,22p' "$0"; exit 0 ;;
        -*) die "unknown argument: $1" ;;
        *) src=$1; shift ;;
      esac
    done
    [[ -n "$src" ]] || die "usage: sutra-restore.sh <backup dir | .tar | .tar.age>"
    need "$PSQL" "$PG_RESTORE" sha256sum stat
    url=$(sutra_url)
    admin_url=$(url_with_db "$url" postgres)
    sutra_db=$(db_name_of "$url")

    work=""
    # `if`, not `[[ … ]] && …`: the EXIT trap's last status becomes the script's exit status, so the
    # short form made every successful restore of a backup DIRECTORY exit 1 (S5-deploy rollback drill).
    cleanup() { if [[ -n "$work" ]]; then rm -rf "$work"; fi; }
    trap cleanup EXIT
    if [[ -f "$src" ]]; then
      work=$(mktemp -d)
      archive=$src
      if [[ "$src" == *.age ]]; then
        need age
        [[ -n "${SUTRA_BACKUP_AGE_IDENTITY:-}" ]] || die "set SUTRA_BACKUP_AGE_IDENTITY for $src"
        age -d -i "$SUTRA_BACKUP_AGE_IDENTITY" -o "$work/backup.tar" "$src"
        archive="$work/backup.tar"
      fi
      tar -C "$work" -xf "$archive"
      dir=$(find "$work" -mindepth 1 -maxdepth 1 -type d -name 'sutra-backup-*' | head -1)
      [[ -n "$dir" ]] || die "no sutra-backup-* directory inside $src"
    else
      dir=$src
    fi
    [[ -f "$dir/manifest.json" ]] || die "$dir/manifest.json missing"
    manifest=$(cat "$dir/manifest.json")

    # --- 1. manifest + checksums -----------------------------------------------------------------
    fmt=$(q "$admin_url" -v m="$manifest" <<'SQL'
    SELECT (:'m')::jsonb->>'format';
    SQL
    )
    [[ "$fmt" == "sutra-backup/v1" ]] || die "unsupported backup format: $fmt"
    mig_backup=$(q "$admin_url" -v m="$manifest" <<'SQL'
    SELECT coalesce((:'m')::jsonb->>'migrationVersion', '0');
    SQL
    )
    declare -A db_file=()
    while IFS='|' read -r name file bytes sha; do
      [[ -n "$name" ]] || continue
      f="$dir/$file"
      [[ -f "$f" ]] || die "$file listed in the manifest is missing"
      [[ "$(file_bytes "$f")" == "$bytes" ]] || die "$file: size $(file_bytes "$f") != manifest $bytes"
      [[ "$(file_sha256 "$f")" == "$sha" ]] || die "$file: sha256 mismatch"
      db_file[$file]=$name
    done < <(q "$admin_url" -F '|' -v m="$manifest" <<'SQL'
    SELECT d->>'name', d->>'file', d->>'bytes', d->>'sha256'
      FROM jsonb_array_elements((:'m')::jsonb->'databases') d;
    SQL
    )
    [[ -n "${db_file[sutra.dump]:-}" ]] || die "manifest has no sutra.dump"
    ok "checksums (${#db_file[@]} dumps, migration $mig_backup)"

    # --- 2. roles --------------------------------------------------------------------------------
    q "$admin_url" -f "$here/roles.sql" >/dev/null
    ok "roles (roles.sql)"

    # --- 3. databases + pg_restore ---------------------------------------------------------------
    ensure_db() { # name owner
      local exists
      exists=$(q "$admin_url" -v d="$1" <<'SQL'
    SELECT count(*) FROM pg_database WHERE datname = :'d';
    SQL
    )
      if [[ "$exists" == 0 ]]; then
        q "$admin_url" -v d="$1" -v o="$2" <<'SQL' >/dev/null
    SELECT format('CREATE DATABASE %I OWNER %I', :'d', :'o') \gexec
    SQL
      fi
    }
    restore_one() { # dump-file target-url [role]
      local file=$1 target=$2 role=${3:-} errlog rc=0
      errlog=$(mktemp)
      local args=(--clean --if-exists --no-owner -d "$target")
      [[ -n "$role" ]] && args+=(--role="$role")
      "$PG_RESTORE" "${args[@]}" "$dir/$file" 2>"$errlog" || rc=$?
      if [[ $rc -ne 0 ]]; then
        grep -E 'error|ERROR' "$errlog" | head -40 >&2 || true
        rm -f "$errlog"
        die "pg_restore $file failed (exit $rc)"
      fi
      rm -f "$errlog"
    }
    me=$(q "$admin_url" -c "SELECT current_user;")
    ensure_db "$sutra_db" "$me"
    restore_one sutra.dump "$url"
    ok "restore sutra -> $sutra_db"
    if [[ -n "${db_file[flowable.dump]:-}" ]]; then
      furl=$(flowable_url)
      [[ -n "$furl" ]] || furl=$(url_with_db "$url" "${db_file[flowable.dump]}")
      fdb=$(db_name_of "$furl")
      ensure_db "$fdb" flowable
      restore_one flowable.dump "$furl" flowable
      ok "restore flowable -> $fdb"
    fi

    # --- 4. migrate ------------------------------------------------------------------------------
    if $migrate; then
      api_bin=${SUTRA_API_BIN:-sutra-api}
      need "$api_bin"
      DATABASE_URL=$url SUTRA_MIGRATION_DATABASE_URL=$url "$api_bin" migrate >&2 \
        || die "sutra-api migrate failed"
      ok "migrate"
    fi

    # --- 5. verify -------------------------------------------------------------------------------
    counts_now=$(q "$url" -c "$(row_counts_sql)")
    mig_now=$(q "$url" -c "$(migration_version_sql)")
    diff=$(q "$url" -v m="$manifest" -v now="$counts_now" -v same="$([[ "$mig_now" == "$mig_backup" ]] && echo t || echo f)" <<'SQL'
    SELECT coalesce(string_agg(format('%s: backup %s, restored %s', b.key, b.value,
                    coalesce((:'now')::jsonb->>b.key, 'missing')), '; ' ORDER BY b.key), '')
      FROM jsonb_each_text((:'m')::jsonb->'rowCounts') b
     WHERE ((:'now')::jsonb->>b.key) IS DISTINCT FROM b.value
       AND NOT (b.key = 'public._sqlx_migrations' AND :'same' = 'f');
    SQL
    )
    [[ -z "$diff" ]] || die "row counts differ: $diff"
    ntables=$(q "$url" -v m="$manifest" <<'SQL'
    SELECT count(*) FROM jsonb_object_keys((:'m')::jsonb->'rowCounts');
    SQL
    )
    ok "row counts ($ntables tables equal the manifest)"

    if [[ $(q "$url" -c "SELECT to_regclass('platform.audit_chain_head') IS NOT NULL;") == t ]]; then
      heads_now=$(q "$url" -c "$(audit_heads_sql)")
    else
      heads_now='[]'
    fi
    same=$(q "$url" -v m="$manifest" -v now="$heads_now" <<'SQL'
    SELECT ((:'m')::jsonb->'auditHeads') = (:'now')::jsonb;
    SQL
    )
    [[ "$same" == t ]] || die "audit heads differ: restored $heads_now"
    ok "audit heads ($(q "$url" -v now="$heads_now" <<'SQL'
    SELECT jsonb_array_length((:'now')::jsonb);
    SQL
    ) tenants equal the manifest)"
    check_audit_grants "$url"

    # --- 6. search rebuild -----------------------------------------------------------------------
    if $rebuild && [[ $(q "$url" -c "SELECT to_regclass('platform.search_checkpoint') IS NOT NULL;") == t ]]; then
      n=$(q "$url" -c "WITH u AS (UPDATE platform.search_checkpoint SET rebuild_requested_at = now(), updated_at = now() RETURNING 1) SELECT count(*) FROM u;")
      ok "search rebuild requested ($n projections; projections without a checkpoint rebuild anyway)"
    fi
    echo "restored $dir"
  roles.sql: |
    -- SutraERP cluster roles, re-created BEFORE pg_restore (slice 9C, docs/runbooks/backup-dr.md).
    --
    -- Roles are cluster-wide, so a database dump never contains them, but the dumps keep their ACLs
    -- (no --no-privileges): the GRANT / REVOKE lines that make platform.audit_log and the audit chain
    -- tables append-only name these roles and fail to restore (silently losing the append-only
    -- privileges) when the roles do not exist. Idempotent; run as a role with CREATEROLE:
    --
    --   psql "$SUTRA_BACKUP_DATABASE_URL" -v ON_ERROR_STOP=1 -f roles.sql
    --
    -- Same list as deploy/postgres/init.sql + migrations/20261014000003_runtime_db_roles.sql. The
    -- runtime LOGIN role (SUTRA_DB_RUNTIME_USER, e.g. sutra_api) is provisioned with its password by
    -- `sutra-api migrate` after the restore; Flowable's login role by deploy/flowable/init-db.sh.
    DO $$
    DECLARE
        s text;
    BEGIN
        FOREACH s IN ARRAY ARRAY['platform', 'institution', 'student', 'academic', 'people', 'finance',
                                 'campus', 'services', 'exams', 'resources', 'app'] LOOP
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'sutra_' || s) THEN
                BEGIN
                    EXECUTE format('CREATE ROLE %I NOLOGIN', 'sutra_' || s);
                EXCEPTION WHEN duplicate_object OR unique_violation THEN
                    NULL;
                END;
            END IF;
        END LOOP;
        -- sutra_app acts with every module role's privileges (as the 1D migration grants it).
        FOREACH s IN ARRAY ARRAY['platform', 'institution', 'student', 'academic', 'people', 'finance',
                                 'campus', 'services', 'exams', 'resources'] LOOP
            EXECUTE format('GRANT %I TO sutra_app', 'sutra_' || s);
        END LOOP;
        IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'flowable') THEN
            BEGIN
                CREATE ROLE flowable NOLOGIN;  -- init-db.sh sets LOGIN + password
            EXCEPTION WHEN duplicate_object OR unique_violation THEN
                NULL;
            END;
        END IF;
    END $$;
  init-db.sh: |
    #!/usr/bin/env bash
    # Flowable database bootstrap (slice 9C, docs/batch9-contracts.md §7): LOGIN role `flowable` and
    # database `flowable` owned by it, on the SutraERP PostgreSQL server. Idempotent (re-running only
    # resets the password). Used as
    #   * /docker-entrypoint-initdb.d/10-flowable.sh in a postgres:18 container (POSTGRES_USER set), and
    #   * the chart's `sutraerp-flowable-init-db` Job / the CI workflow (libpq env: PGHOST, PGPORT,
    #     PGUSER, PGPASSWORD, or SUTRA_FLOWABLE_ADMIN_URL).
    # Env: FLOWABLE_DB_PASSWORD (required), FLOWABLE_DB_USER (default flowable),
    #      FLOWABLE_DB_NAME (default flowable).
    set -euo pipefail
    : "${FLOWABLE_DB_PASSWORD:?set FLOWABLE_DB_PASSWORD}"
    user=${FLOWABLE_DB_USER:-flowable}
    db=${FLOWABLE_DB_NAME:-flowable}
    admin_user=${POSTGRES_USER:-postgres}
    export PGUSER=${PGUSER:-$admin_user}
    export PGDATABASE=${PGDATABASE:-postgres}
    conn=()
    [[ -n "${SUTRA_FLOWABLE_ADMIN_URL:-}" ]] && conn=("$SUTRA_FLOWABLE_ADMIN_URL")

    for i in $(seq 1 60); do
      if psql "${conn[@]}" -qAtX -c 'SELECT 1' >/dev/null 2>&1; then break; fi
      [[ $i -eq 60 ]] && { echo "init-db: PostgreSQL not reachable" >&2; exit 1; }
      sleep 2
    done

    psql "${conn[@]}" -qAtX -v ON_ERROR_STOP=1 -v u="$user" -v p="$FLOWABLE_DB_PASSWORD" -v d="$db" <<'SQL'
    SELECT format(CASE WHEN EXISTS (SELECT 1 FROM pg_roles WHERE rolname = :'u')
                       THEN 'ALTER ROLE %I WITH LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE PASSWORD %L'
                       ELSE 'CREATE ROLE %I WITH LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE PASSWORD %L' END,
                  :'u', :'p') \gexec
    SELECT format('CREATE DATABASE %I OWNER %I', :'d', :'u')
     WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = :'d') \gexec
    SELECT format('ALTER DATABASE %I OWNER TO %I', :'d', :'u') \gexec
    SELECT format('REVOKE ALL ON DATABASE %I FROM PUBLIC', :'d') \gexec
    SQL
    echo "ok flowable database ($db, role $user)"
{{- end }}
