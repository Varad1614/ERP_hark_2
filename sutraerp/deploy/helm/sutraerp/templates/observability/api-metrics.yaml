{{- /* 9A: the API's separate /metrics listener (SUTRA_METRICS_ADDR, never the public Service / ingress). */ -}}
{{- if .Values.observability.enabled }}
{{- $fullname := include "sutraerp.fullname" . }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-api-metrics
  labels:
    {{- include "sutraerp.labels" . | nindent 4 }}
    app.kubernetes.io/component: api-metrics
spec:
  type: ClusterIP
  selector:
    {{- include "sutraerp.selectorLabels" (dict "root" . "component" "api") | nindent 4 }}
  ports:
    - name: metrics
      port: {{ .Values.api.metricsPort }}
      targetPort: {{ .Values.api.metricsPort }}
      protocol: TCP
{{- if .Values.networkPolicy.enabled }}
---
# Additive policy: only Prometheus (the lgtm all-in-one in CI, the observability namespace in
# production) may reach the metrics port of the API pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-api-metrics
  labels:
    {{- include "sutraerp.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "sutraerp.selectorLabels" (dict "root" . "component" "api") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "sutraerp.selectorLabels" (dict "root" . "component" "lgtm") | nindent 14 }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.observability.prometheusNamespace | default "observability" }}
      ports:
        - port: {{ .Values.api.metricsPort }}
          protocol: TCP
{{- end }}
{{- end }}
