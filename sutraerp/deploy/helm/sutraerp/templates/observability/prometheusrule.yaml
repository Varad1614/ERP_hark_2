{{- /* 9A: the `sutra` alert group (deploy/observability/alerts/sutra.rules.yaml, embedded by gen.py). */ -}}
{{- if and .Values.observability.enabled .Values.observability.prometheusRule.enabled }}
{{- $rules := include "sutraerp.observability.rules" . | b64dec | fromYaml }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "sutraerp.fullname" . }}-alerts
  labels:
    {{- include "sutraerp.labels" . | nindent 4 }}
    {{- with .Values.observability.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- toYaml $rules | nindent 2 }}
{{- end }}
