# Audit 2026-10 (A1): same-origin Keycloak for the public OIDC demo (docker-compose.oidc-demo.yml).
# Baked into the web image only with --build-arg SUTRA_WEB_KEYCLOAK_PROXY=1; included inside the
# server block of nginx.conf. Only the browser-facing realm endpoints and theme resources are
# proxied — the admin console (/auth/admin) and the master realm are never reachable here.
#
# Keycloak serves under /auth (KC_HTTP_RELATIVE_PATH) at keycloak:8180, so the URI is passed
# unchanged. These locations declare their own add_header / proxy_hide_header, so the SPA's
# server-level CSP and the hidden upstream headers do NOT apply: Keycloak's login pages keep their
# own Content-Security-Policy and X-Frame-Options.
location ^~ /auth/realms/master {
  return 404;
}

location ^~ /auth/realms/ {
  limit_req zone=sutra_credentials burst=50 nodelay;
  set $sutra_kc_upstream http://keycloak:8180;
  proxy_pass $sutra_kc_upstream;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Host $http_host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $sutra_forwarded_proto;
  proxy_buffer_size 128k;
  proxy_buffers 4 256k;
  proxy_busy_buffers_size 256k;
  proxy_hide_header X-Powered-By;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Strict-Transport-Security $sutra_hsts always;
}

location ^~ /auth/resources/ {
  set $sutra_kc_upstream http://keycloak:8180;
  proxy_pass $sutra_kc_upstream;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Host $http_host;
  proxy_set_header X-Forwarded-Proto $sutra_forwarded_proto;
  proxy_hide_header X-Powered-By;
  add_header X-Content-Type-Options nosniff always;
  add_header Strict-Transport-Security $sutra_hsts always;
}
