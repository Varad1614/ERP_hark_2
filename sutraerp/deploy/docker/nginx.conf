# 9D: security (SEC-9D-009 / SEC-9D-010, docs/security/findings.md) — nginx drops every
# server-level add_header in a location that declares its own, so the old per-location
# Cache-Control silently removed X-Frame-Options / nosniff / Referrer-Policy from the SPA and
# its assets. Cache-Control now comes from this map (conf.d files are included inside http {}),
# so the security headers below are inherited by every location. /api/ keeps the API's own
# Cache-Control (empty value = header not added).
map $uri $sutra_cache_control {
  ~^/api/     "";
  ~^/assets/  "public, max-age=31536000, immutable";
  default     "no-cache";
}

# Part 1 S3 (SEC-9D-012): HSTS whenever the browser reached us over TLS (the TLS-terminating
# ingress sets X-Forwarded-Proto: https). Plain-http local / compose stacks get no header (empty
# value = not added); browsers ignore HSTS over http anyway.
# Audit 2026-10 (A1): the scheme the browser used — the TLS edge's X-Forwarded-Proto when it sends
# one, else this listener's (used by the optional same-origin Keycloak proxy, nginx-keycloak.conf).
map $http_x_forwarded_proto $sutra_forwarded_proto {
  ""      $scheme;
  default $http_x_forwarded_proto;
}

map $http_x_forwarded_proto $sutra_hsts {
  https   "max-age=31536000; includeSubDomains";
  default "";
}

# Part 1 · Stage 3 (S3-config, docs/security/config.md): coarse per-client flood guard in front
# of the API's own limiter — password / second-factor endpoints and the rest of the API.
# Part 2 · S5-capacity (DEF-P2-CAP-003): the flood-guard key is the CLIENT, not the proxy. The
# web container always sits behind a TLS edge / ingress, so $binary_remote_addr was the proxy's
# address and the whole college shared ONE 100 r/s bucket (and one 10 r/s credentials bucket).
# When the peer is on a private network (the edge, an ingress controller, the compose host
# gateway) the key is the address that proxy appended last to X-Forwarded-For; any other peer
# is keyed by its own address. $remote_addr itself is untouched, so the API's
# SUTRA_TRUSTED_PROXY_HOPS client-address rule (its own limiter, audit) is unchanged. A client
# that reaches this port directly from a private network could pick its bucket by sending
# X-Forwarded-For; expose the web port only to the edge (docs/security/config.md).
geo $sutra_peer_is_proxy {
  default        0;
  127.0.0.0/8    1;
  10.0.0.0/8     1;
  172.16.0.0/12  1;
  192.168.0.0/16 1;
  ::1            1;
  fc00::/7       1;
}
map $http_x_forwarded_for $sutra_xff_last {
  "~(?<sutra_last>[^,\s]+)\s*$" $sutra_last;
  default "";
}
map "$sutra_peer_is_proxy:$sutra_xff_last" $sutra_flood_key {
  "~^1:(?<sutra_client>.+)$" $sutra_client;
  default $binary_remote_addr;
}
limit_req_zone $sutra_flood_key zone=sutra_credentials:10m rate=10r/s;
limit_req_zone $sutra_flood_key zone=sutra_api:20m rate=100r/s;
limit_req_status 429;

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off; # 9D: security

  # Part 1 · Stage 3 (S3-config): request size and slow-client limits. The API accepts at most
  # 2 MiB bodies (SUTRA_MAX_BODY_BYTES) and answers within SUTRA_REQUEST_TIMEOUT_SECS (30 s).
  client_max_body_size 2m;
  client_body_timeout 30s;
  client_header_timeout 15s;
  send_timeout 30s;
  keepalive_timeout 30s;

  # Part 1 · Stage 3 (S3-config): $sutra_csp_script_hashes — SHA-256 of the SPA's inline bootstrap
  # scripts, generated at image build (deploy/docker/csp-hashes.mjs), replaces 'unsafe-inline'
  # in script-src (SEC-9D-011).
  include /etc/nginx/sutra-csp.conf;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;
  # Part 2 S4 (UI fees, DEF-F-007): Razorpay Checkout — the script from checkout.razorpay.com
  # (injected only when SUTRA_PAYMENT_GATEWAY=razorpay), its frames and calls on api.razorpay.com /
  # checkout.razorpay.com. Nothing else is loosened (docs/security/config.md).
  # 9D: security — CSP / permissions / isolation. Everything is same-origin: the API is proxied
  # below. style-src keeps 'unsafe-inline' for React inline style attributes (no script runs
  # from a style attribute; accepted, docs/security/config.md).
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' $sutra_csp_script_hashes https://checkout.razorpay.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://api.razorpay.com; frame-src 'self' https://api.razorpay.com https://checkout.razorpay.com; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  add_header Cross-Origin-Opener-Policy same-origin always;
  add_header Cross-Origin-Resource-Policy same-origin always;
  add_header Cache-Control $sutra_cache_control always; # 9D: security (was per location)
  add_header Strict-Transport-Security $sutra_hsts always; # Part 1 S3: SEC-9D-012

  # Same-origin API so the HttpOnly session cookie needs no CORS.
  # The upstream is resolved per request through Docker's embedded DNS (valid 10 s), not once at
  # start-up: after `docker compose restart api` (or a recreate) the api container can come back
  # on a new address and a start-up-resolved upstream answers 502 for ever (DEF-P1-DEMO-004).
  # proxy_pass with a variable and no URI forwards the original request URI unchanged.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $sutra_api_upstream http://api:8080;

  # Part 1 · Stage 3 (S3-config): the API sends its own hardening headers (for direct exposure);
  # behind this proxy the server-level set above applies once, without duplicates.
  proxy_hide_header X-Content-Type-Options;
  proxy_hide_header Referrer-Policy;
  proxy_hide_header X-Frame-Options;
  proxy_hide_header Content-Security-Policy;
  proxy_hide_header Permissions-Policy;
  proxy_hide_header Cross-Origin-Resource-Policy;
  proxy_hide_header Strict-Transport-Security;
  proxy_connect_timeout 5s;
  proxy_send_timeout 35s;
  proxy_read_timeout 35s;

  # Part 1 · Stage 3 (S3-config): password / second-factor endpoints get the tight zone.
  location ~ ^/api/v1/auth/(login|mfa) {
    limit_req zone=sutra_credentials burst=50 nodelay;
    proxy_pass $sutra_api_upstream;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Part 2 · S4-docs: document file uploads (PUT …/documents/{id}/file) may carry up to
  # SUTRA_DOCS_MAX_BYTES (default 10 MiB, at most 64 MiB; the API enforces the exact limit on the
  # route and keeps 2 MiB everywhere else); slower clients get 120 s.
  location ~ ^/api/v1/student/(admissions|students)/[^/]+/documents/[^/]+/file$ {
    limit_req zone=sutra_api burst=400 nodelay;
    client_max_body_size 11m;
    client_body_timeout 120s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_pass $sutra_api_upstream;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Part 2 · S4-ui-import: the data import upload (POST /api/v1/platform/imports) carries the file
  # as base64 JSON — up to the engine's 8 MiB file ≈ 10.7 MiB of body (the API enforces the exact
  # route limit, 2 MiB everywhere else).
  location = /api/v1/platform/imports {
    limit_req zone=sutra_api burst=400 nodelay;
    client_max_body_size 11m;
    client_body_timeout 120s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_pass $sutra_api_upstream;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    limit_req zone=sutra_api burst=400 nodelay;
    proxy_pass $sutra_api_upstream;
    # $http_host keeps the port so the API's Origin/Host same-site check matches the browser Origin.
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /assets/ {
    # 9D: security — Cache-Control comes from $sutra_cache_control (no add_header here).
    try_files $uri =404;
  }

  # Audit 2026-10 (A1): optional extra locations baked in at image build (empty by default;
  # SUTRA_WEB_KEYCLOAK_PROXY=1 adds the same-origin Keycloak proxy, nginx-keycloak.conf).
  include /etc/nginx/sutra-extra/*.conf;

  # Audit 2026-10 (META-2): a path ending in a file extension (outside /api/) is a static file or
  # nothing — real 404 instead of the SPA's index.html (robots.txt, favicon.ico, security.txt and
  # the manifest are shipped from apps/web/public). App routes never end in an extension.
  location ~ ^/(?!api/)(?:.*/)?[^/]+\.[A-Za-z0-9]+$ {
    try_files $uri =404;
  }

  # SPA fallback (React Router SPA mode).
  location / {
    try_files $uri $uri/ /index.html;
  }
}
