# 9D: security (SEC-9D-009 / SEC-9D-010, docs/security/findings.md) — nginx drops every
# server-level add_header in a location that declares its own, so the old per-location
# Cache-Control silently removed X-Frame-Options / nosniff / Referrer-Policy from the SPA and
# its assets. Cache-Control now comes from this map (conf.d files are included inside http {}),
# so the security headers below are inherited by every location. /api/ keeps the API's own
# Cache-Control (empty value = header not added).
map $uri $sutra_cache_control {
  ~^/api/     "";
  ~^/assets/  "public, max-age=31536000, immutable";
  default     "no-cache";
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off; # 9D: security

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;
  # 9D: security — CSP / permissions / isolation. script-src needs 'unsafe-inline' for the React
  # Router SPA bootstrap scripts in index.html (SEC-9D-011, accepted; hash-based CSP is the
  # follow-up). Everything is same-origin: the API is proxied below.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  add_header Cross-Origin-Opener-Policy same-origin always;
  add_header Cross-Origin-Resource-Policy same-origin always;
  add_header Cache-Control $sutra_cache_control always; # 9D: security (was per location)

  # Same-origin API so the HttpOnly session cookie needs no CORS.
  location /api/ {
    proxy_pass http://api:8080;
    # $http_host keeps the port so the API's Origin/Host same-site check matches the browser Origin.
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /assets/ {
    # 9D: security — Cache-Control comes from $sutra_cache_control (no add_header here).
    try_files $uri =404;
  }

  # SPA fallback (React Router SPA mode).
  location / {
    try_files $uri $uri/ /index.html;
  }
}
