# SutraERP alert rules (docs/batch9-contracts.md §3.4, group `sutra`). Generated by
# deploy/observability/gen.py (run from deploy/observability/) — edit there; promtool tests in alerts/tests/.
groups:
- name: sutra
  interval: 1m
  rules:
  - alert: SutraApiHighErrorRate
    expr: sum(rate(sutra_http_requests_total{status="5xx"}[5m])) / clamp_min(sum(rate(sutra_http_requests_total[5m])), 1e-9) > 0.02
    for: 10m
    labels:
      severity: critical
    annotations:
      summary: SutraERP API 5xx error rate above 2 %
      description: More than 2 % of API requests answered 5xx over the last 10 minutes.
      runbook_url: https://github.com/Varad1614/ERP_hark_2/blob/erp_merge/sutraerp/docs/runbooks/observability.md#SutraApiHighErrorRate
  - alert: SutraApiLatencyP95
    expr: histogram_quantile(0.95, sum by (le) (rate(sutra_http_request_duration_seconds_bucket[5m]))) > 1
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: SutraERP API p95 latency above 1 s
      description: The 95th percentile of API request latency stayed above 1 second for 10 minutes.
      runbook_url: https://github.com/Varad1614/ERP_hark_2/blob/erp_merge/sutraerp/docs/runbooks/observability.md#SutraApiLatencyP95
  - alert: SutraOutboxBacklog
    expr: max(sutra_outbox_pending) > 1000
    for: 15m
    labels:
      severity: warning
    annotations:
      summary: SutraERP outbox backlog above 1000 events
      description: More than 1000 outbox events are waiting to be relayed to NATS for 15 minutes.
      runbook_url: https://github.com/Varad1614/ERP_hark_2/blob/erp_merge/sutraerp/docs/runbooks/observability.md#SutraOutboxBacklog
  - alert: SutraAuditUnsealed
    expr: min(min_over_time(sutra_audit_unsealed[5m])) > 0
    for: 30m
    labels:
      severity: warning
    annotations:
      summary: SutraERP audit rows stay unsealed
      description: Audit rows have been waiting for an audit chain entry for 30 minutes; the sealer is not keeping up or not running.
      runbook_url: https://github.com/Varad1614/ERP_hark_2/blob/erp_merge/sutraerp/docs/runbooks/observability.md#SutraAuditUnsealed
  - alert: SutraAuditChainBroken
    expr: sum(increase(sutra_audit_chain_verify_failures_total[15m])) > 0
    labels:
      severity: critical
    annotations:
      summary: SutraERP audit chain verification failed
      description: An audit chain verification found a broken chain (tampering, a lost entry or a wrong anchor). Treat as a security incident.
      runbook_url: https://github.com/Varad1614/ERP_hark_2/blob/erp_merge/sutraerp/docs/runbooks/observability.md#SutraAuditChainBroken
  - alert: SutraJobFailing
    expr: sum by (job) (increase(sutra_job_runs_total{outcome="error"}[30m])) >= 3
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: SutraERP scheduled job keeps failing
      description: A scheduled job failed at least 3 times in the last 30 minutes.
      runbook_url: https://github.com/Varad1614/ERP_hark_2/blob/erp_merge/sutraerp/docs/runbooks/observability.md#SutraJobFailing
  - alert: SutraDbPoolSaturated
    expr: max by (instance) (sutra_db_pool_connections{state="used"}) / max by (instance) (sutra_db_pool_connections{state="max"}) > 0.9
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: SutraERP database pool above 90 % in use
      description: An API instance used more than 90 % of its PostgreSQL pool for 10 minutes.
      runbook_url: https://github.com/Varad1614/ERP_hark_2/blob/erp_merge/sutraerp/docs/runbooks/observability.md#SutraDbPoolSaturated
