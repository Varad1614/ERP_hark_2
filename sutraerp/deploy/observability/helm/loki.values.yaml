# grafana/loki values (single binary) for SutraERP. Logs arrive over OTLP from the collector;
# `trace_id` / `span_id` are kept as structured metadata for trace ↔ log correlation.
deploymentMode: SingleBinary
loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2026-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index: { prefix: index_, period: 24h }
  limits_config:
    allow_structured_metadata: true
    retention_period: 720h
  otlp_config:
    resource_attributes:
      attributes_config:
        - action: index_label
          attributes: [service.name, deployment.environment]
singleBinary:
  replicas: 1
  persistence: { size: 50Gi }
backend: { replicas: 0 }
read: { replicas: 0 }
write: { replicas: 0 }
