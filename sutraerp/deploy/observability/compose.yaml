# CI observability stack (slice 9A, docs/batch9-contracts.md §3): PostgreSQL 18 for the API and
# the grafana/otel-lgtm all-in-one (OpenTelemetry Collector + Prometheus + Loki + Tempo + Grafana).
# The API itself runs on the host (`sutra-api serve`) and exports OTLP to localhost:4317; the
# bundled Prometheus scrapes its /metrics listener on host.docker.internal:9464.
#
#   docker compose -f deploy/observability/compose.yaml up -d --wait
#   SUTRA_CI_MODE=compose bash deploy/ci/check-telemetry.sh
name: sutra-observability

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: sutra
      POSTGRES_PASSWORD: sutra
      POSTGRES_DB: sutra
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sutra -d sutra"]
      interval: 3s
      timeout: 3s
      retries: 40

  lgtm:
    image: grafana/otel-lgtm:0.36.0
    ports:
      - "3000:3000"   # Grafana (anonymous admin)
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "9090:9090"   # Prometheus
      - "3100:3100"   # Loki
      - "3200:3200"   # Tempo
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./lgtm/prometheus.yaml:/otel-lgtm/prometheus.yaml:ro
      - ./alerts/sutra.rules.yaml:/otel-lgtm/sutra-rules/sutra.rules.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/ready"]
      interval: 5s
      timeout: 3s
      retries: 60
