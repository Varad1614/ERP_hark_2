[package]
name = "sutra-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "SutraERP modular-monolith API server (composition root)."
default-run = "sutra-api"

[lib]
name = "sutra_api"
path = "src/lib.rs"

[[bin]]
name = "sutra-api"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
sutra-kernel.workspace = true
sutra-contracts.workspace = true
sutra-persistence.workspace = true
sutra-web.workspace = true
sutra-infra.workspace = true
sutra-platform.workspace = true
sutra-institution.workspace = true
sutra-student.workspace = true
sutra-academic.workspace = true
sutra-people.workspace = true
sutra-finance.workspace = true
sutra-campus.workspace = true
sutra-services.workspace = true
sutra-exams.workspace = true
sutra-resources.workspace = true
tokio.workspace = true
tokio-util.workspace = true
axum.workspace = true
tower.workspace = true
tower-http.workspace = true
http.workspace = true
utoipa.workspace = true
utoipa-axum.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
dotenvy.workspace = true
thiserror.workspace = true
uuid.workspace = true
# 9A: telemetry export + Prometheus metrics (contract §3)
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
opentelemetry-otlp.workspace = true
opentelemetry-semantic-conventions.workspace = true
opentelemetry-appender-tracing.workspace = true
tracing-opentelemetry.workspace = true
prometheus-client.workspace = true
# INT: bridge of the 9C `metrics` facade into the prometheus-client registry
metrics.workspace = true
# 9C: SearchIndex adapter over sutra_infra::opensearch
async-trait.workspace = true

[dev-dependencies]
http-body-util.workspace = true
chrono.workspace = true
async-trait.workspace = true
async-nats.workspace = true
rust_decimal.workspace = true

[features]
# End-to-end tests against a live PostgreSQL 18 (set DATABASE_URL). Off by default.
db-tests = []
# With db-tests: end-to-end outbox relay to a live `nats-server -js` (SUTRA_TEST_NATS_URL).
nats-tests = []
# 9C: with db-tests, live Flowable REST (SUTRA_TEST_FLOWABLE_URL) / OpenSearch (SUTRA_TEST_OPENSEARCH_URL).
flowable-tests = []
opensearch-tests = []
