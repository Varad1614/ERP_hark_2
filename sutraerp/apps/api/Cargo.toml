[package]
name = "sutra-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "SutraERP modular-monolith API server (composition root)."
default-run = "sutra-api"

[lib]
name = "sutra_api"
path = "src/lib.rs"

[[bin]]
name = "sutra-api"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
sutra-kernel.workspace = true
sutra-contracts.workspace = true
sutra-persistence.workspace = true
sutra-web.workspace = true
sutra-infra.workspace = true
sutra-platform.workspace = true
sutra-institution.workspace = true
sutra-student.workspace = true
sutra-academic.workspace = true
sutra-people.workspace = true
sutra-finance.workspace = true
sutra-campus.workspace = true
sutra-services.workspace = true
sutra-exams.workspace = true
sutra-resources.workspace = true
tokio.workspace = true
tokio-util.workspace = true
axum.workspace = true
tower.workspace = true
tower-http.workspace = true
http.workspace = true
utoipa.workspace = true
utoipa-axum.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
dotenvy.workspace = true
thiserror.workspace = true
uuid.workspace = true

[dev-dependencies]
http-body-util.workspace = true
chrono.workspace = true
async-trait.workspace = true
async-nats.workspace = true

[features]
# End-to-end tests against a live PostgreSQL 18 (set DATABASE_URL). Off by default.
db-tests = []
# With db-tests: end-to-end outbox relay to a live `nats-server -js` (SUTRA_TEST_NATS_URL).
nats-tests = []
