[package]
name = "sutra-infra"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Infrastructure adapters behind kernel ports: NATS JetStream MessagePublisher (ADR-L5-0022), Valkey Cache (ADR-L5-0037), SMTP MailSender, S3-compatible object storage."

[lints]
workspace = true

[dependencies]
sutra-kernel.workspace = true
async-trait.workspace = true
tokio.workspace = true
tracing.workspace = true
async-nats.workspace = true
redis.workspace = true
lettre.workspace = true
# 9C: OpenSearch REST client
reqwest.workspace = true
serde_json.workspace = true
url.workspace = true
# Part 2 S4-pay: Razorpay client (webhook / checkout HMAC-SHA256) + its local contract stub
hmac.workspace = true
sha2.workspace = true
axum = { workspace = true, optional = true }

[dev-dependencies]
axum.workspace = true
tokio = { workspace = true, features = ["net"] }
uuid.workspace = true
serde_json.workspace = true
serde.workspace = true

[features]
# Live tests against a local nats-server -js (SUTRA_TEST_NATS_URL, default nats://127.0.0.1:4222).
nats-tests = []
# Live tests against a local valkey/redis (SUTRA_TEST_VALKEY_URL, default redis://127.0.0.1:6379).
valkey-tests = []
# Part 2 S4-pay: `razorpay::stub` (local HTTP stub of the Razorpay API) for other crates' tests.
razorpay-stub = ["dep:axum", "tokio/net"]
# Part 2 · S4-docs: live tests against a local MinIO (SUTRA_TEST_S3_ENDPOINT, default http://127.0.0.1:9000).
s3-tests = []
