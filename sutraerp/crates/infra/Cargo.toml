[package]
name = "sutra-infra"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Infrastructure adapters behind kernel ports: NATS JetStream MessagePublisher (ADR-L5-0022), Valkey Cache (ADR-L5-0037), SMTP MailSender."

[lints]
