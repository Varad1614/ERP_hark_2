[dependencies]
sutra-kernel.workspace = true
async-trait.workspace = true
tokio.workspace = true
tracing.workspace = true
async-nats.workspace = true
redis.workspace = true
lettre.workspace = true

[dev-dependencies]
uuid.workspace = true
serde_json.workspace = true
serde.workspace = true

[features]
# Live tests against a local nats-server -js (SUTRA_TEST_NATS_URL, default nats://127.0.0.1:4222).
nats-tests = []
# Live tests against a local valkey/redis (SUTRA_TEST_VALKEY_URL, default redis://127.0.0.1:6379).
valkey-tests = []
