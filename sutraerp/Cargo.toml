[workspace]
resolver = "2"
members = [
    "crates/kernel",
    "crates/contracts",
    "crates/persistence",
    "crates/web",
    "crates/infra",
    "modules/platform",
    "modules/institution",
    "modules/student",
    "modules/academic",
    "modules/people",
    "modules/finance",
    "modules/campus",
    "modules/services",
    "modules/exams",
    "modules/resources",
    "apps/api",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
# Internal crates
sutra-kernel = { path = "crates/kernel" }
sutra-contracts = { path = "crates/contracts" }
sutra-persistence = { path = "crates/persistence" }
sutra-web = { path = "crates/web" }
sutra-infra = { path = "crates/infra" }
sutra-platform = { path = "modules/platform" }
sutra-institution = { path = "modules/institution" }
sutra-student = { path = "modules/student" }
sutra-academic = { path = "modules/academic" }
sutra-people = { path = "modules/people" }
sutra-finance = { path = "modules/finance" }
sutra-campus = { path = "modules/campus" }
sutra-services = { path = "modules/services" }
sutra-exams = { path = "modules/exams" }
sutra-resources = { path = "modules/resources" }

# Runtime / HTTP (ADR-L5-0019)
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "tower-log", "matched-path", "original-uri"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "timeout", "limit", "sensitive-headers", "catch-panic"] }
http = "1"
http-body-util = "0.1"
tokio-util = { version = "0.7", default-features = false }

# Contracts / OpenAPI (ADR-L5-0021 / 0034)
utoipa = { version = "5", features = ["uuid", "chrono", "decimal"] }
utoipa-axum = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Persistence (ADR-L5-0020 / 0036)
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "uuid", "chrono", "rust_decimal", "json", "migrate", "macros"] }

# Primitives
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
rust_decimal = { version = "1", features = ["serde-with-str"] }
thiserror = "2"
async-trait = "0.1"
sha2 = "0.10"
hmac = "0.12"
subtle = "2"
getrandom = "0.3"

# Observability (ADR-L5-0029 hooks)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }

dotenvy = "0.15"

# Auth: OIDC back-channel (ADR-L5-0024), ID-token validation, TOTP/AES-GCM (ADR-L5-0038)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
jsonwebtoken = { version = "9", default-features = false, features = ["use_pem"] }
ring = "0.17"
base64 = "0.22"

# Messaging + cache adapters (ADR-L5-0022 NATS JetStream, ADR-L5-0037 Valkey); rustls only
async-nats = { version = "0.50", default-features = false, features = ["ring", "jetstream"] }
redis = { version = "1", default-features = false, features = ["tokio-comp", "tokio-rustls-comp", "tls-rustls-webpki-roots", "connection-manager"] }

# Dev-mode WebAuthn second factor (Batch 1D). webauthn-rs-core links the system OpenSSL
# (libssl): rust:1-bookworm ships libssl-dev and distroless/cc-debian12 ships libssl3.
webauthn-rs = { version = "0.5", features = ["danger-allow-state-serialisation"] }
url = "2"

# SMTP e-mail channel for notifications (Batch 1D), rustls only; lives in sutra-infra.
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1", "tokio1-rustls", "ring", "webpki-roots", "builder", "hostname"] }

# 9A: OpenTelemetry trace + log export over OTLP (gRPC via tonic, HTTP/protobuf via the blocking
# reqwest client) and the Prometheus `/metrics` listener (docs/batch9-contracts.md §3). One
# version-matched set: opentelemetry* 0.33 <-> tracing-opentelemetry 0.34.
opentelemetry = { version = "0.33", default-features = false, features = ["trace", "logs"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace", "logs"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["trace", "logs", "grpc-tonic", "tls-ring", "tls-webpki-roots", "http-proto", "reqwest-blocking-client"] }
opentelemetry-semantic-conventions = "0.33"
opentelemetry-appender-tracing = { version = "0.33", default-features = false }
tracing-opentelemetry = { version = "0.34", default-features = false }
prometheus-client = "0.25"
# 9C: metrics facade for sutra_workflow_calls_total / sutra_search_projection_lag_seconds
metrics = "0.24"

# Part 2 · S4-import: data migration files — XLSX read (calamine, MIT) and XLSX write
# (rust_xlsxwriter, MIT OR Apache-2.0); both pure Rust, zip with deflate only.
calamine = { version = "0.36", default-features = false, features = ["dates"] }
rust_xlsxwriter = { version = "0.99", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 4
strip = "symbols"

# Lighter profile for local Docker images (Docker Desktop / WSL with ~8 GB): no LTO, more but
# smaller codegen units, less optimisation -> far lower peak rustc memory and a much faster build.
[profile.docker]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
incremental = false
