name: SutraERP CI

on:
  push:
    branches: [main, erp_merge, "dev/**", "batch5/**", "batch6/**", "batch7/**", "batch8/**", "batch9/**", "ui/**", "reskin2/**", "part1/**"]
    paths: ["sutraerp/**", ".github/workflows/sutraerp-ci.yml"]
  workflow_dispatch:
  pull_request:
    paths: ["sutraerp/**", ".github/workflows/sutraerp-ci.yml"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  SQLX_OFFLINE: "true"

defaults:
  run:
    working-directory: sutraerp

jobs:
  rust:
    name: Rust (fmt · clippy · test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sutraerp
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: test
        run: cargo test --workspace --locked

  rust-db:
    name: Rust integration (PostgreSQL 18 · NATS JetStream · Valkey)
    runs-on: ubuntu-24.04
    services:
      valkey:
        image: valkey/valkey:8
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: sutra
          POSTGRES_PASSWORD: sutra
          POSTGRES_DB: sutra
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sutra" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://sutra:sutra@localhost:5432/sutra
      SUTRA_TEST_NATS_URL: nats://127.0.0.1:4222
      SUTRA_TEST_VALKEY_URL: redis://127.0.0.1:6379
      MINIO_TAG: RELEASE.2025-10-15T17-29-55Z
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sutraerp
      # Service containers cannot pass server flags, so JetStream runs as a plain container.
      - name: Start NATS (JetStream)
        run: docker run -d --name nats -p 4222:4222 nats:2.11 -js
      # Part 2 · S4-idp: real Keycloak (compose dev realm import) for the identity provisioning
      # tests; started early so it boots while the tests compile.
      - name: Start Keycloak 26 (realm import)
        run: |
          docker run -d --name keycloak -p 8180:8180 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin \
            -v "$PWD/deploy/keycloak/realm-sutra-dev.json:/opt/keycloak/data/import/realm-sutra-dev.json:ro" \
            quay.io/keycloak/keycloak:26.7 start-dev --import-realm --http-port=8180
      - run: cargo test -p sutra-persistence -p sutra-platform --features db-tests --locked --no-fail-fast
      # Full api DB suite: every tests/db*.rs file (incl. db_b5_foundation, db_b5a, db_b5b) + api + architecture.
      - run: cargo test -p sutra-api --features db-tests --locked --no-fail-fast -- --test-threads 2
      # Part 2 S4-import: the 2,000-student CSV import prints its timing (shown in this log).
      - name: Data import volume (2,000 students, timing)
        run: cargo test -p sutra-api --features db-tests --locked --test db_p2_import -- --nocapture two_thousand_students_import_timing
      - name: Live NATS / Valkey adapter tests
        run: |
          cargo test -p sutra-infra --features nats-tests,valkey-tests --locked
          cargo test -p sutra-api --features db-tests,nats-tests --test live_relay --locked
      - name: Live Keycloak identity provisioning (S4-idp)
        env:
          SUTRA_TEST_KEYCLOAK_URL: http://localhost:8180
        run: |
          for i in $(seq 1 120); do
            curl -fsS http://localhost:8180/realms/sutra/.well-known/openid-configuration >/dev/null 2>&1 && break
            [ "$i" = 120 ] && { docker logs --tail 200 keycloak; exit 1; }
            sleep 2
          done
          cargo test -p sutra-api --features db-tests,keycloak-tests --test live_keycloak_idp --locked -- --test-threads 1 --nocapture
      - name: Keycloak log (on failure)
        if: failure()
        run: docker logs --tail 300 keycloak || true
      # Part 2 · S4-docs: real S3-compatible storage. MinIO publishes no pullable images any more, and
      # no third-party mirror images are used: the server is built from its archived upstream source
      # at a pinned release tag (cached per tag) and runs as a host process with a random root
      # user / secret for this job only.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - name: MinIO binary cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/sutra-minio
          key: minio-${{ env.MINIO_TAG }}-${{ runner.os }}-${{ runner.arch }}
      - name: Build MinIO from source (${{ env.MINIO_TAG }})
        run: OUT="$HOME/.cache/sutra-minio/minio" bash deploy/minio/build-from-source.sh
      - name: Start MinIO + create the test buckets
        run: |
          set -euo pipefail
          user="ci$(openssl rand -hex 6)"; secret="$(openssl rand -hex 24)"
          echo "::add-mask::$secret"
          { echo "SUTRA_TEST_S3_ACCESS_KEY=$user"; echo "SUTRA_TEST_S3_SECRET_KEY=$secret"; } >> "$GITHUB_ENV"
          MINIO_BIN="$HOME/.cache/sutra-minio/minio" MINIO_ROOT_USER="$user" MINIO_ROOT_PASSWORD="$secret" \
            MINIO_DATA="$RUNNER_TEMP/minio-data" MINIO_LOG="$RUNNER_TEMP/minio.log" \
            MINIO_BUCKETS="sutra-it-docs" bash deploy/minio/start-local.sh
      - name: Live S3 adapter + document storage DB tests (MinIO)
        env:
          SUTRA_TEST_S3_ENDPOINT: http://127.0.0.1:9000
        run: |
          cargo test -p sutra-infra --features s3-tests --test live_s3 --locked
          cargo test -p sutra-api --features db-tests,s3-tests --test db_p2_docs --locked -- --test-threads 2
      - name: MinIO log
        if: failure()
        run: tail -n 200 "$RUNNER_TEMP/minio.log" || true

  openapi-drift:
    name: OpenAPI drift
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sutraerp
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: sutraerp/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: sutraerp/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Regenerate spec + TS client from code
        run: |
          cargo run -q -p sutra-api -- openapi > /tmp/openapi.json
          cp /tmp/openapi.json openapi/openapi.json
          pnpm gen:api
      - name: Upload regenerated spec + TS client
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openapi-regenerated
          path: |
            sutraerp/openapi/openapi.json
            sutraerp/packages/api-client/src/schema.d.ts
          retention-days: 7
      - name: Committed openapi/openapi.json + TS client match the code
        run: git diff --exit-code -- openapi/openapi.json packages/api-client/src/schema.d.ts

  web:
    name: Web (typecheck · lint · test · build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: sutraerp/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: sutraerp/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm lint
      - run: pnpm -r test
      - run: pnpm -r build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: sutraerp/apps/web/build/client
          retention-days: 7

  # Batch 5 integration: aarch64 API binary for the sandbox e2e run (the sandbox cannot link sutra-api).
  api-bin-arm:
    name: API binary (aarch64, for sandbox e2e)
    if: startsWith(github.ref, 'refs/heads/batch5/')
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sutraerp
      - run: cargo build -p sutra-api --locked
      - uses: actions/upload-artifact@v4
        with:
          name: sutra-api-aarch64
          path: sutraerp/target/debug/sutra-api
          retention-days: 3

  # reskin2 = visual proof for the re-skin v2 (every screen at 1440×960 + /dev/catalogue → artifact
  # e2e-shots-reskin2); e2e builds set VITE_UI_CATALOGUE=1 so the dev-only catalogue is served.
  # Click-through e2e suites in preview mode (Batch 3 student, Batch 4 academic, Batch 5 finance, Batch 6 exams, Batch 7 people, Batch 8 campus,
  # UI re-skin shell/homes/workspaces); screenshots uploaded as artifacts (the sandbox OOMs running
  # chromium + API + preview together). Runs on ui/**, batch*/**, part1/** (dispatch) and erp_merge.
  e2e:
    name: E2E ${{ matrix.suite }} (preview)
    if: startsWith(github.ref, 'refs/heads/batch') || startsWith(github.ref, 'refs/heads/ui/') || startsWith(github.ref, 'refs/heads/reskin2/') || startsWith(github.ref, 'refs/heads/part1/') || startsWith(github.ref, 'refs/heads/part2/') || github.ref == 'refs/heads/erp_merge'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        suite: [finance, student, academic, ui, exams, people, campus, reskin2]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: sutra
          POSTGRES_PASSWORD: sutra
          POSTGRES_DB: sutra_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sutra" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://sutra:sutra@localhost:5432/sutra_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sutraerp
          shared-key: e2e-api
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: sutraerp/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: sutraerp/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: cargo build -p sutra-api --locked
      - run: SUTRA_ENV=development target/debug/sutra-api migrate
      - run: pnpm --filter @sutra/web exec playwright install --with-deps chromium
      - run: VITE_AUTH_MODE=api VITE_UI_CATALOGUE=1 pnpm --filter @sutra/web build
      - name: ${{ matrix.suite }} e2e
        run: E2E_WEB=preview VITE_AUTH_MODE=api E2E_SHOTS=$RUNNER_TEMP/shots CARGO_TARGET_DIR=$GITHUB_WORKSPACE/sutraerp/target timeout 1200 pnpm e2e:${{ matrix.suite }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-shots-${{ matrix.suite }}
          path: ${{ runner.temp }}/shots
          retention-days: 7

  # Part 2 · S4-ui-import: Admin → Data import click-through (apps/web/e2e/imports.e2e.mjs) — upload,
  # mapping, dry run with row errors + error report, commit, opening balances awaiting a second
  # approver (maker ≠ checker), history, export. Also runs on part2/** (workflow_dispatch).
  e2e-imports:
    name: E2E imports (preview)
    if: startsWith(github.ref, 'refs/heads/part2/') || startsWith(github.ref, 'refs/heads/ui/') || startsWith(github.ref, 'refs/heads/part1/') || github.ref == 'refs/heads/erp_merge'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: sutra
          POSTGRES_PASSWORD: sutra
          POSTGRES_DB: sutra_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sutra" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://sutra:sutra@localhost:5432/sutra_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sutraerp
          shared-key: e2e-api
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: sutraerp/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: sutraerp/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: cargo build -p sutra-api --locked
      - run: SUTRA_ENV=development target/debug/sutra-api migrate
      - run: pnpm --filter @sutra/web exec playwright install --with-deps chromium
      - run: VITE_AUTH_MODE=api pnpm --filter @sutra/web build
      - name: imports e2e
        run: E2E_WEB=preview VITE_AUTH_MODE=api E2E_SHOTS=$RUNNER_TEMP/shots CARGO_TARGET_DIR=$GITHUB_WORKSPACE/sutraerp/target timeout 1200 pnpm e2e:imports
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-shots-imports
          path: ${{ runner.temp }}/shots
          retention-days: 7

  # 9B (ADR-L5-0030, docs/batch9-contracts.md §10.2): buildx images with SBOM + max provenance.
  # erp_merge / v* tags: push to ghcr.io/varad1614, Cosign keyless sign + syft SPDX attestation +
  # verify against the workflow identity. Every other ref: push only to a throwaway local
  # registry:2 and rehearse the same sign → attest → verify path with a generated key (nothing
  # leaves the runner).
  images:
    name: Container images (build · push · sign)
    runs-on: ubuntu-24.04
    needs: [rust, web]
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
    services:
      registry:
        image: registry:2.8.3
        ports: ["5000:5000"]
    env:
      RELEASE: ${{ github.ref == 'refs/heads/erp_merge' || startsWith(github.ref, 'refs/tags/v') }}
      DOCKER_METADATA_SHORT_SHA_LENGTH: "12"
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        working-directory: /
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - name: Registry
        id: reg
        run: |
          if [ "$RELEASE" = "true" ]; then echo "prefix=ghcr.io/varad1614" >> "$GITHUB_OUTPUT"; echo "mode=keyless" >> "$GITHUB_OUTPUT"
          else echo "prefix=localhost:5000/varad1614" >> "$GITHUB_OUTPUT"; echo "mode=key" >> "$GITHUB_OUTPUT"; fi
      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/erp_merge' || startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags (api)
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.reg.outputs.prefix }}/sutraerp-api
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/erp_merge' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=ci,enable=${{ env.RELEASE != 'true' }}
      - name: Image tags (web)
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.reg.outputs.prefix }}/sutraerp-web
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/erp_merge' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=ci,enable=${{ env.RELEASE != 'true' }}
      - name: Build + push api (CARGO_PROFILE=release)
        id: api
        uses: docker/build-push-action@v6
        with:
          context: sutraerp
          file: sutraerp/deploy/docker/api.Dockerfile
          build-args: |
            CARGO_PROFILE=release
            CARGO_BUILD_JOBS=4
            SUTRA_GIT_SHA=${{ github.sha }}
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=images-api
          cache-to: type=gha,scope=images-api,mode=max
      - name: Build + push web
        id: web
        uses: docker/build-push-action@v6
        with:
          context: sutraerp
          file: sutraerp/deploy/docker/web.Dockerfile
          build-args: |
            SUTRA_GIT_SHA=${{ github.sha }}
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=images-web
          cache-to: type=gha,scope=images-web,mode=max
      - uses: sigstore/cosign-installer@v3.10.1
        with:
          cosign-release: v2.6.5
      - uses: anchore/sbom-action/download-syft@v0.24.3
        with:
          syft-version: v1.54.1
      - name: Sign + attest SBOM + verify (${{ steps.reg.outputs.mode }})
        env:
          COSIGN_MODE: ${{ steps.reg.outputs.mode }}
          SBOM_OUT_DIR: ${{ runner.temp }}/sbom
          API_REF: ${{ steps.reg.outputs.prefix }}/sutraerp-api@${{ steps.api.outputs.digest }}
          WEB_REF: ${{ steps.reg.outputs.prefix }}/sutraerp-web@${{ steps.web.outputs.digest }}
          TAGS: ${{ steps.meta-api.outputs.tags }}
        run: |
          set -euo pipefail
          for ref in "$API_REF" "$WEB_REF"; do
            bash deploy/docker/sign-verify.sh "$ref"
          done
          {
            echo "### Images ($COSIGN_MODE)"
            echo "- api: \`$API_REF\`"
            echo "- web: \`$WEB_REF\`"
            echo "- api tags: $(echo "$TAGS" | tr '\n' ' ')"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Provenance + buildkit SBOM present
        env:
          API_REF: ${{ steps.reg.outputs.prefix }}/sutraerp-api@${{ steps.api.outputs.digest }}
          WEB_REF: ${{ steps.reg.outputs.prefix }}/sutraerp-web@${{ steps.web.outputs.digest }}
        run: |
          set -euo pipefail
          for ref in "$API_REF" "$WEB_REF"; do
            if docker buildx imagetools inspect "$ref" --format '{{ json .Provenance }}' | jq -e '[.. | objects | select(has("SLSA"))] | length > 0' >/dev/null; then echo "ok provenance $ref"; else echo "no provenance on $ref" >&2; exit 1; fi
            if docker buildx imagetools inspect "$ref" --format '{{ json .SBOM }}' | jq -e '[.. | objects | select(has("SPDX"))] | length > 0' >/dev/null; then echo "ok buildkit-sbom $ref"; else echo "no buildkit SBOM on $ref" >&2; exit 1; fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-spdx
          path: ${{ runner.temp }}/sbom
          retention-days: 14
