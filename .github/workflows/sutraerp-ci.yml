name: SutraERP CI

on:
  push:
    branches: [main, erp_merge, "dev/**"]
    paths: ["sutraerp/**", ".github/workflows/sutraerp-ci.yml"]
  pull_request:
    paths: ["sutraerp/**", ".github/workflows/sutraerp-ci.yml"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  SQLX_OFFLINE: "true"

defaults:
  run:
    working-directory: sutraerp

jobs:
  rust:
    name: Rust (fmt · clippy · test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sutraerp
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: test
        run: cargo test --workspace --locked

  rust-db:
    name: Rust integration (PostgreSQL 18 · NATS JetStream · Valkey)
    runs-on: ubuntu-24.04
    services:
      valkey:
        image: valkey/valkey:8
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: sutra
          POSTGRES_PASSWORD: sutra
          POSTGRES_DB: sutra
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sutra" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://sutra:sutra@localhost:5432/sutra
      SUTRA_TEST_NATS_URL: nats://127.0.0.1:4222
      SUTRA_TEST_VALKEY_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sutraerp
      # Service containers cannot pass server flags, so JetStream runs as a plain container.
      - name: Start NATS (JetStream)
        run: docker run -d --name nats -p 4222:4222 nats:2.11 -js
      - run: cargo test -p sutra-persistence -p sutra-platform -p sutra-api --features db-tests --locked
      - name: Live NATS / Valkey adapter tests
        run: |
          cargo test -p sutra-infra --features nats-tests,valkey-tests --locked
          cargo test -p sutra-api --features db-tests,nats-tests --test live_relay --locked

  openapi-drift:
    name: OpenAPI drift
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sutraerp
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: sutraerp/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: sutraerp/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Spec generated from code matches committed openapi/openapi.json
        run: |
          cargo run -q -p sutra-api -- openapi > /tmp/openapi.json
          diff -u openapi/openapi.json /tmp/openapi.json
      - name: TS client matches the spec
        run: |
          pnpm gen:api
          git diff --exit-code packages/api-client/src/schema.d.ts

  web:
    name: Web (typecheck · lint · test · build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: sutraerp/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: sutraerp/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm lint
      - run: pnpm -r test
      - run: pnpm -r build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: sutraerp/apps/web/build/client
          retention-days: 7

  # ADR-L5-0030: image build/push to GHCR + Cosign signing is wired in Batch 9 (production
  # hardening) on ephemeral trusted runners; Batch 0 only verifies the images build.
  images:
    name: Container images (build only)
    runs-on: ubuntu-24.04
    needs: [rust, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: sutraerp
          file: sutraerp/deploy/docker/api.Dockerfile
          push: false
          tags: sutraerp/api:ci
      - uses: docker/build-push-action@v6
        with:
          context: sutraerp
          file: sutraerp/deploy/docker/web.Dockerfile
          push: false
          tags: sutraerp/web:ci
