# Batch 9 · owned by slice 9E (sutraerp/docs/batch9-contracts.md §2, §10, §12.4).
# Proves the pilot seed: build the API, migrate, serve it in dev auth with the fixed pilot tenant,
# run deploy/ci/seed-pilot.sh (seed → second run must change nothing → API reads asserting the
# PILOT institution is active with its students, staff, fees, library and hostel). Keep the job
# name stable (the pinger and b9-ci.sh read it).
name: SutraERP pilot (seeded pilot institution)

on:
  push:
    branches: [ERP_EXTENSIONS, main, erp_merge, "batch9/**"]
    tags: ["v*"]
    paths: ["sutraerp/**", ".github/workflows/sutraerp-pilot.yml"]
  workflow_dispatch:
  pull_request:
    paths: ["sutraerp/**", ".github/workflows/sutraerp-pilot.yml"]

permissions:
  contents: read

concurrency:
  group: sutraerp-pilot-${{ github.ref }}
  cancel-in-progress: true

env:
  # Audit 2026-10 (A1, D1/C1): the dev authenticator has no default password. CI-only value, used
  # by every API started in dev auth mode, the E2E sign-in and the scripts that log in.
  SUTRA_DEV_AUTH_PASSWORD: ci-only-dev-signin-6d2f9b
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  SQLX_OFFLINE: "true"

defaults:
  run:
    working-directory: sutraerp

jobs:
  pilot:
    name: Pilot seed (API + PostgreSQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: sutra
          POSTGRES_PASSWORD: sutra
          POSTGRES_DB: sutra
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sutra" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://sutra:sutra@localhost:5432/sutra
      PILOT_TENANT_ID: 0192f5a0-7c3e-7000-8000-000000009110
      # Part 1 S3 (DEF-X-003): the API serves as the runtime login role (RLS applies, like
      # production); DATABASE_URL (schema owner) is used only to migrate/provision and for the
      # seed script's psql seeding.
      SUTRA_DB_RUNTIME_USER: sutra_pilot_runtime
      SUTRA_DB_RUNTIME_PASSWORD: sutra-pilot-runtime-pw
      RUNTIME_DATABASE_URL: postgres://sutra_pilot_runtime:sutra-pilot-runtime-pw@localhost:5432/sutra
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sutraerp
          shared-key: e2e-api
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tools
        run: |
          command -v psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)
          psql --version && jq --version && node --version
      - name: Build the API
        run: cargo build -p sutra-api --locked
      - name: Migrate
        run: SUTRA_ENV=development target/debug/sutra-api migrate
      # Part 1 (DEF-X-001): the pilot seed exercises data loading, not the approval control, so the
      # dev API opts in to SUTRA_APPROVAL_MODE=auto (default is human; production refuses auto).
      - name: Serve (dev auth, pilot tenant)
        run: |
          SUTRA_ENV=development SUTRA_HTTP_ADDR=127.0.0.1:8080 SUTRA_AUTH_MODE=dev SUTRA_DEV_MFA=false \
          SUTRA_DEV_TENANT_ID="$PILOT_TENANT_ID" SUTRA_SESSION_COOKIE_SECURE=false SUTRA_OUTBOX_RELAY=off \
          SUTRA_CACHE=memory SUTRA_INBOX_CONSUMER=false SUTRA_APPROVAL_MODE=auto SUTRA_WEBAUTHN_RP_ID=localhost SUTRA_WEBAUTHN_ORIGINS=http://localhost:3000 RUST_LOG=warn \
          DATABASE_URL="$RUNTIME_DATABASE_URL" \
            nohup target/debug/sutra-api serve >"$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 90); do
            curl -fsS http://127.0.0.1:8080/health/live >/dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "API did not become live" >&2
          tail -n 100 "$RUNNER_TEMP/api.log" >&2
          exit 1
      - name: Stage script dry run
        run: bash deploy/ci/seed-pilot.sh --dry-run
      - name: Seed the pilot twice (idempotent) and read it back
        env:
          SUTRA_CI_API_URL: http://127.0.0.1:8080
          SUTRA_CI_MODE: compose
        run: bash deploy/ci/seed-pilot.sh | tee "$RUNNER_TEMP/seed-pilot.txt"
      # Part 2 · S6-pilot: the synthetic pilot tenant can be reset and rebuilt (deploy/pilot/reset-pilot.sh):
      # refusals first (wrong confirmation, a non-synthetic institution, production), then a dry run,
      # the reset (tenant verified empty), and the seed again (first run creates, second changes nothing).
      - name: Reset the synthetic pilot tenant and seed it again
        env:
          SUTRA_CI_API_URL: http://127.0.0.1:8080
          SUTRA_CI_MODE: compose
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/seed-pilot.txt"
          { echo; echo "## reset (S6-pilot)"; } | tee -a "$OUT"
          rc=0; bash deploy/pilot/reset-pilot.sh --confirm 00000000-0000-0000-0000-000000000000 || rc=$?
          [ "$rc" = 2 ] || { echo "a wrong --confirm must be refused (exit 2), got $rc" >&2; exit 1; }
          echo "ok reset-refuses-wrong-confirmation" | tee -a "$OUT"
          rc=0; SUTRA_ENV=production bash deploy/pilot/reset-pilot.sh --confirm "$PILOT_TENANT_ID" || rc=$?
          [ "$rc" = 2 ] || { echo "production must be refused (exit 2), got $rc" >&2; exit 1; }
          echo "ok reset-refuses-production" | tee -a "$OUT"
          rc=0; PILOT_RESET_INSTITUTION_CODES=OTHER bash deploy/pilot/reset-pilot.sh --confirm "$PILOT_TENANT_ID" || rc=$?
          [ "$rc" = 2 ] || { echo "a tenant with a non-synthetic institution must be refused (exit 2), got $rc" >&2; exit 1; }
          echo "ok reset-refuses-non-synthetic-institution" | tee -a "$OUT"
          before="$(psql "$DATABASE_URL" -qtAX -c "SELECT count(*) FROM student.student WHERE tenant_id = '$PILOT_TENANT_ID'")"
          bash deploy/pilot/reset-pilot.sh --dry-run --confirm "$PILOT_TENANT_ID" | tee -a "$OUT"
          after_dry="$(psql "$DATABASE_URL" -qtAX -c "SELECT count(*) FROM student.student WHERE tenant_id = '$PILOT_TENANT_ID'")"
          [ "$before" = "$after_dry" ] && [ "$before" -ge 50 ] || { echo "dry run changed data ($before → $after_dry)" >&2; exit 1; }
          echo "ok reset-dry-run-changes-nothing ($before students kept)" | tee -a "$OUT"
          other="$(psql "$DATABASE_URL" -qtAX -c "SELECT count(*) FROM platform.audit_log WHERE tenant_id <> '$PILOT_TENANT_ID'")"
          bash deploy/pilot/reset-pilot.sh --confirm "$PILOT_TENANT_ID" | tee -a "$OUT"
          other_after="$(psql "$DATABASE_URL" -qtAX -c "SELECT count(*) FROM platform.audit_log WHERE tenant_id <> '$PILOT_TENANT_ID'")"
          [ "$other" = "$other_after" ] || { echo "the reset touched other tenants' audit rows ($other → $other_after)" >&2; exit 1; }
          echo "ok reset-other-tenants-untouched ($other audit rows)" | tee -a "$OUT"
          bash deploy/ci/seed-pilot.sh | tee -a "$OUT"
          echo "ok reseed-after-reset" | tee -a "$OUT"
      - name: Summary
        if: always()
        run: |
          {
            echo "### Pilot seed"
            echo '```'
            cat "$RUNNER_TEMP/seed-pilot.txt" 2>/dev/null || echo "(no output)"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
      - name: API log on failure
        if: failure()
        run: tail -n 300 "$RUNNER_TEMP/api.log" || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: pilot-diagnostics
          path: ${{ runner.temp }}/api.log
          retention-days: 7
